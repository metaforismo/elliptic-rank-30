name: verify-cyclic-cubic-base-ranks

on:
  push:
    paths:
      - "search/verify_cyclic_cubic_base_rank.sage.py"
      - ".github/workflows/verify-cyclic-cubic-base-ranks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    container:
      image: sagemath/sagemath:10.9
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute rigorous ranks with proof flags
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p search/results
          sage -python search/verify_cyclic_cubic_base_rank.sage.py \
            --scales '1,2,3,4,6,8,9,12,18,24,27,30,36,48,54,72,81,108' \
            --output search/results/cyclic_cubic_base_ranks.json
      - name: Preserve exact rank certificate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search/results/cyclic_cubic_base_ranks.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record rigorous ranks of cyclic cubic bases"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
