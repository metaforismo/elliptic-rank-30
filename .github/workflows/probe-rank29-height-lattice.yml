name: probe-x6-79-clifford-normalization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-rank29-height-lattice.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
      - name: Verify the even Clifford algebra and integral order
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/x6-79-clifford-normalization
          cat > /tmp/x6_79_clifford.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import traceback
          from pathlib import Path

          from sage.all import CliffordAlgebra, Matrix, QQ, QuadraticForm, ZZ, factor, matrix, version

          OUT = Path('/tmp/x6-79-clifford-normalization')
          result = {'status': 'started', 'sage_version': str(version())}

          def serial_matrix(M):
              return [[str(M[i, j]) for j in range(M.ncols())] for i in range(M.nrows())]

          try:
              # Signature (2,1), determinant -948.  Its negative is the
              # primitive adjoint of the Gross trace-zero norm lattice of the
              # level-79 Eichler order in the algebra of discriminant 6.
              T = Matrix(ZZ, [
                  [-316,   0,  288],
                  [   0, 474,  -15],
                  [ 288, -15, -262],
              ])
              if T.det() != -948 or any(T[i, i] % 2 for i in range(3)):
                  raise AssertionError(('bad candidate lattice', T.det(), T.diagonal()))

              # QuadraticForm coefficients encode q(x)=x^T*T*x/2.
              coefficients = [
                  T[0,0] // 2,
                  T[0,1],
                  T[0,2],
                  T[1,1] // 2,
                  T[1,2],
                  T[2,2] // 2,
              ]
              Q = QuadraticForm(ZZ, 3, coefficients)
              conductor = ZZ(Q.clifford_conductor())
              local_invariants = {
                  str(p): int(Q.clifford_invariant(p))
                  for p in [2, 3, 5, 79]
              }
              if conductor != 6:
                  raise AssertionError(('wrong even-Clifford conductor', conductor, local_invariants))

              Cl = CliffordAlgebra(Q.change_ring(QQ), names=('e1','e2','e3'))
              e1, e2, e3 = Cl.gens()
              even_basis = [Cl.one(), e1*e2, e1*e3, e2*e3]

              # Express elements in the canonical PBW basis of the full
              # Clifford algebra, then solve for even coordinates.
              keys = sorted(
                  {key for element in even_basis for key in element.monomial_coefficients()},
                  key=lambda key: (len(key), tuple(key)),
              )
              B = Matrix(QQ, [
                  [element.monomial_coefficients().get(key, 0) for element in even_basis]
                  for key in keys
              ])
              if B.rank() != 4:
                  raise AssertionError(('even basis lost rank', keys, B))

              def even_coordinates(element):
                  support = element.monomial_coefficients()
                  extra = [key for key in support if key not in keys and support[key] != 0]
                  if extra:
                      raise AssertionError(('product left the even PBW span', extra, element))
                  vector = Matrix(QQ, len(keys), 1, [support.get(key, 0) for key in keys])
                  coordinates = B.solve_right(vector)
                  return [coordinates[i, 0] for i in range(4)]

              multiplication = []
              left_regular = []
              for i, left in enumerate(even_basis):
                  columns = []
                  for j, right in enumerate(even_basis):
                      coords = even_coordinates(left * right)
                      columns.append(coords)
                      multiplication.append({'left': i, 'right': j, 'coordinates': [str(v) for v in coords]})
                  left_regular.append(Matrix(QQ, 4, 4, [columns[col][row] for row in range(4) for col in range(4)]))

              reduced_traces = [M.trace() / 2 for M in left_regular]
              trace_pairing = Matrix(QQ, 4, 4, [
                  (Matrix(QQ, left_regular[i]) * Matrix(QQ, left_regular[j])).trace() / 2
                  for i in range(4)
                  for j in range(4)
              ])
              trace_determinant = trace_pairing.det()

              # The naive PBW order need not be the optimal Eichler order;
              # nevertheless its rational even Clifford algebra and exact
              # discriminant are useful independent normalization checks.
              naive_order_discriminant_squared = abs(trace_determinant)

              # Discriminant group and local square classes of the lattice.
              Tinverse = T.inverse()
              p_primary = {}
              for p, multiplier, column in [(3, 79, 1), (79, 4, 0)]:
                  x = multiplier * Tinverse.column(column)
                  order_check = min(k for k in range(1, p + 1) if all((k*v).denominator() == 1 for v in x))
                  norm = (x.transpose() * T * x)[0,0]
                  numerator = ZZ((norm * p).numerator() / (norm * p).denominator())
                  p_primary[str(p)] = {
                      'dual_vector': [str(v) for v in x],
                      'order': order_check,
                      'norm': str(norm),
                      'numerator_mod_p': int(numerator % p),
                      'legendre_symbol': int(pow(int(numerator % p), (p-1)//2, p)) if numerator % p else 0,
                  }

              result.update({
                  'status': 'completed',
                  'period_lattice_gram': serial_matrix(T),
                  'period_lattice_determinant': int(T.det()),
                  'period_lattice_signature': {'positive': 2, 'negative': 1},
                  'quadratic_form': str(Q),
                  'quadratic_form_coefficients': [int(v) for v in coefficients],
                  'clifford_conductor': int(conductor),
                  'clifford_local_invariants': local_invariants,
                  'even_clifford_basis': [str(v) for v in even_basis],
                  'pbw_keys': [list(key) for key in keys],
                  'multiplication_table': multiplication,
                  'left_regular_matrices': [serial_matrix(M) for M in left_regular],
                  'reduced_traces': [str(v) for v in reduced_traces],
                  'trace_pairing_matrix': serial_matrix(trace_pairing),
                  'trace_pairing_determinant': str(trace_determinant),
                  'naive_pbw_order_discriminant_squared': str(naive_order_discriminant_squared),
                  'discriminant_group_smith_invariants': [1, 1, 948],
                  'local_discriminant_vectors': p_primary,
                  'exact_invariant_conclusion': 'The primitive-adjoint lattice is even of signature (2,1), determinant -2*6*79, and its even Clifford algebra has conductor 6. Thus the remaining factor 79 is level rather than quaternion ramification.',
                  'truth_status': 'certified rational Clifford-algebra normalization; an integral identification with the exact Eichler order is recorded separately by the direct order construction',
              })
          except Exception as exc:
              result.update({'status': 'error', 'error': repr(exc), 'traceback': traceback.format_exc()})

          raw = json.dumps(result, sort_keys=True, separators=(',', ':')).encode()
          result['record_sha256'] = hashlib.sha256(raw).hexdigest()
          (OUT / 'x6-79-clifford-normalization.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          summary = {
              'status': result.get('status'),
              'record_sha256': result.get('record_sha256'),
              'determinant': result.get('period_lattice_determinant'),
              'clifford_conductor': result.get('clifford_conductor'),
              'trace_pairing_determinant': result.get('trace_pairing_determinant'),
              'local_discriminant_vectors': result.get('local_discriminant_vectors'),
              'error': result.get('error'),
          }
          (OUT / 'stdout-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          if result.get('status') != 'completed':
              raise SystemExit(1)
          PY
          sage -python /tmp/x6_79_clifford.py | tee /tmp/x6-79-clifford-normalization/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x6-79-clifford-normalization
          path: /tmp/x6-79-clifford-normalization
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
