name: probe-rank17-genus-api

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-rank29-height-lattice.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
      - name: Inspect discriminant-form and genus APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rank17-genus-api
          cat > /tmp/probe_genus.py <<'PY'
          from __future__ import annotations

          import inspect
          import json
          import traceback
          from pathlib import Path

          from sage.all import IntegralLattice, Matrix, ZZ, version

          OUT = Path('/tmp/rank17-genus-api')
          payload = {'status': 'started', 'sage_version': str(version())}

          def public_methods(obj):
              return sorted(name for name in dir(obj) if not name.startswith('_'))

          def method_info(obj, name):
              if not hasattr(obj, name):
                  return None
              value = getattr(obj, name)
              info = {'callable': callable(value), 'repr': repr(value)}
              if callable(value):
                  try:
                      info['signature'] = str(inspect.signature(value))
                  except Exception as exc:
                      info['signature_error'] = repr(exc)
                  try:
                      info['source'] = inspect.getsource(value)
                  except Exception as exc:
                      info['source_error'] = repr(exc)
              return info

          try:
              T = Matrix(ZZ, [
                  [-316,   0,  288],
                  [   0, 474,  -15],
                  [ 288, -15, -262],
              ])
              L = IntegralLattice(T)
              D = L.discriminant_group()
              DT = D.twist(-1)
              genus = DT.genus((17, 0))

              interesting = [
                  'representative', 'representatives', 'gram_matrix', 'is_global',
                  'global_symbol', 'local_symbols', 'mass', 'genus', 'is_represented_by',
                  'rational_representative', 'standard_representative', 'is_even',
                  'signature_pair', 'discriminant_form', 'discriminant_group',
                  'neighbors', 'p_neighbors', 'neighbor', 'local_modification',
                  'maximal_overlattice', 'overlattice', 'sublattices', 'short_vector_list_up_to_length',
              ]
              payload.update({
                  'status': 'completed',
                  'period_lattice_gram': [[int(T[i,j]) for j in range(3)] for i in range(3)],
                  'period_lattice_genus': str(L.genus()),
                  'period_discriminant_group': str(D),
                  'period_discriminant_group_invariants': [int(v) for v in D.invariants()],
                  'period_discriminant_form_gram': [[str(D.gram_matrix_quadratic()[i,j]) for j in range(D.gram_matrix_quadratic().ncols())] for i in range(D.gram_matrix_quadratic().nrows())],
                  'twisted_discriminant_form': str(DT),
                  'target_genus': str(genus),
                  'lattice_methods': public_methods(L),
                  'discriminant_module_methods': public_methods(D),
                  'target_genus_methods': public_methods(genus),
                  'interesting_methods': {},
              })
              for name in interesting:
                  for owner_name, owner in [('lattice', L), ('discriminant', D), ('twisted', DT), ('genus', genus)]:
                      info = method_info(owner, name)
                      if info is not None:
                          payload['interesting_methods'][f'{owner_name}.{name}'] = info

              # Try every plausible constructor in fail-closed mode.  A successful
              # result is accepted only after exact signature, determinant, parity,
              # and discriminant-form checks.
              attempts = []
              for name in ('representative', 'standard_representative', 'rational_representative', 'gram_matrix'):
                  if not hasattr(genus, name):
                      continue
                  method = getattr(genus, name)
                  if not callable(method):
                      continue
                  try:
                      value = method()
                      attempts.append({'method': name, 'status': 'returned', 'type': str(type(value)), 'repr': repr(value)[:5000]})
                  except Exception as exc:
                      attempts.append({'method': name, 'status': 'error', 'error': repr(exc)})
              payload['constructor_attempts'] = attempts
          except Exception as exc:
              payload.update({'status': 'error', 'error': repr(exc), 'traceback': traceback.format_exc()})

          (OUT / 'genus-api.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'status': payload.get('status'),
              'target_genus': payload.get('target_genus'),
              'constructor_attempts': payload.get('constructor_attempts'),
              'error': payload.get('error'),
          }, indent=2, sort_keys=True))
          if payload.get('status') != 'completed':
              raise SystemExit(1)
          PY
          sage -python /tmp/probe_genus.py | tee /tmp/rank17-genus-api/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank17-genus-api
          path: /tmp/rank17-genus-api
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
