name: probe-rank17-lattice-catalogue

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-rank29-height-lattice.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and search the Nebe-Sloane lattice catalogue
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/rank17-lattice-catalogue
          mkdir -p "$out"
          curl --fail --location --retry 3 --user-agent 'elliptic-rank-30-reproducible-research/1.0' \
            https://www.math.rwth-aachen.de/~Gabriele.Nebe/LATTICES/union.gz \
            --output "$out/union.gz"
          file "$out/union.gz" | tee "$out/file-type.txt"
          sha256sum "$out/union.gz" | tee "$out/SHA256SUMS"
          gzip -dc "$out/union.gz" > "$out/union.std"
          wc -c -l "$out/union.std" | tee "$out/union-size.txt"
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import re
          from pathlib import Path

          root = Path('/tmp/rank17-lattice-catalogue')
          text = (root / 'union.std').read_text(errors='replace')

          # Entries in union.std begin with NAME on its own line.  Keep every
          # block intact so exact candidate records can be audited later.
          starts = [match.start() for match in re.finditer(r'(?m)^NAME\s*$', text)]
          entries = []
          for index, start in enumerate(starts):
              end = starts[index + 1] if index + 1 < len(starts) else len(text)
              block = text[start:end].strip() + '\n'
              lines = block.splitlines()

              def field(label):
                  for i, line in enumerate(lines):
                      if line.strip() == label and i + 1 < len(lines):
                          return lines[i + 1].strip()
                  return None

              name = field('NAME')
              dimension = field('DIMENSION')
              determinant = field('DET')
              minimum = field('MINIMAL_NORM')
              kissing = field('KISSING_NUMBER')
              record = {
                  'entry_index': index,
                  'name': name,
                  'dimension_raw': dimension,
                  'determinant_raw': determinant,
                  'minimal_norm_raw': minimum,
                  'kissing_number_raw': kissing,
                  'sha256': hashlib.sha256(block.encode()).hexdigest(),
                  'block': block,
              }
              entries.append(record)

          def rational_number(value):
              if value is None:
                  return None
              value = value.strip().replace('D', 'E')
              try:
                  return float(value)
              except Exception:
                  try:
                      return float(eval(value, {'__builtins__': {}}, {}))
                  except Exception:
                      return None

          dim17 = []
          exact = []
          near = []
          for record in entries:
              dimension = rational_number(record['dimension_raw'])
              determinant = rational_number(record['determinant_raw'])
              minimum = rational_number(record['minimal_norm_raw'])
              kissing = rational_number(record['kissing_number_raw'])
              if dimension == 17:
                  summary = {key: value for key, value in record.items() if key != 'block'}
                  dim17.append(summary)
                  if determinant is not None and abs(determinant - 948) < 1e-9:
                      exact.append(record)
                  score = 0
                  if determinant is not None and determinant > 0:
                      score += abs(math.log(determinant / 948.0))
                  else:
                      score += 100
                  if minimum is not None:
                      score += abs(minimum - 4)
                  else:
                      score += 10
                  if kissing is not None:
                      score += abs(kissing - 2622) / 2622.0
                  else:
                      score += 10
                  near.append((score, record))

          near.sort(key=lambda item: item[0])
          exact_records = []
          for record in exact:
              path = root / f"exact-{record['entry_index']:06d}-{record['name'] or 'unnamed'}.std"
              path.write_text(record['block'])
              exact_records.append({key: value for key, value in record.items() if key != 'block'})
          nearest_records = []
          for rank, (score, record) in enumerate(near[:100], 1):
              nearest_records.append({
                  **{key: value for key, value in record.items() if key != 'block'},
                  'distance_score': score,
                  'rank': rank,
              })

          payload = {
              'status': 'completed',
              'catalogue_entry_count': len(entries),
              'dimension_17_entry_count': len(dim17),
              'exact_dimension17_determinant948_count': len(exact_records),
              'exact_records': exact_records,
              'nearest_dimension17_records': nearest_records,
              'target': {
                  'dimension': 17,
                  'determinant': 948,
                  'minimal_norm': 4,
                  'kissing_number': 2622,
              },
              'interpretation': 'An empty exact list means only that the target lattice is absent from this catalogue snapshot; it is not a nonexistence result.',
          }
          (root / 'catalogue-search.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          (root / 'dimension17-index.json').write_text(json.dumps(dim17, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'catalogue_entry_count': len(entries),
              'dimension_17_entry_count': len(dim17),
              'exact_dimension17_determinant948_count': len(exact_records),
              'nearest': [
                  {
                      'name': row['name'],
                      'determinant': row['determinant_raw'],
                      'minimum': row['minimal_norm_raw'],
                      'kissing': row['kissing_number_raw'],
                      'score': row['distance_score'],
                  }
                  for row in nearest_records[:10]
              ],
          }, indent=2, sort_keys=True))
          PY
          sha256sum "$out/union.std" "$out/catalogue-search.json" "$out/dimension17-index.json" >> "$out/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank17-lattice-catalogue-search
          path: /tmp/rank17-lattice-catalogue
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
