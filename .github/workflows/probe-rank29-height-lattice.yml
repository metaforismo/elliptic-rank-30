name: probe-elkies-primary-source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-rank29-height-lattice.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect the arXiv source bundle
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/elkies-primary-source
          mkdir -p "$out/source"
          curl --fail --location --retry 3 --user-agent 'elliptic-rank-30-reproducible-research/1.0' \
            https://arxiv.org/src/0709.2908 \
            --output "$out/0709.2908-source"
          file "$out/0709.2908-source" | tee "$out/file-type.txt"
          sha256sum "$out/0709.2908-source" | tee "$out/source.sha256"
          python3 - <<'PY'
          from __future__ import annotations

          import gzip
          import shutil
          import tarfile
          from pathlib import Path

          root = Path('/tmp/elkies-primary-source')
          source = root / '0709.2908-source'
          target = root / 'source'
          if tarfile.is_tarfile(source):
              with tarfile.open(source, 'r:*') as archive:
                  for member in archive.getmembers():
                      path = Path(member.name)
                      if path.is_absolute() or '..' in path.parts:
                          raise SystemExit(f'unsafe archive path: {member.name}')
                  archive.extractall(target)
          else:
              try:
                  with gzip.open(source, 'rb') as compressed:
                      payload = compressed.read()
                  (target / 'source.tex').write_bytes(payload)
              except OSError:
                  shutil.copy2(source, target / 'source.tex')
          PY
          find "$out/source" -type f -printf '%P\t%s bytes\n' | LC_ALL=C sort | tee "$out/source-files.tsv"
          grep -RniE \
            '1311|2622|948|6[[:space:]]*[.*x×\\]?[[:space:]]*79|Niemeier|Leech|Gram|lattice|height[ -]?4|Shimura|X\(6|disc\(|discriminant|slice|neighbor|neighbour' \
            "$out/source" > "$out/relevant-contexts.txt" || true
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('/tmp/elkies-primary-source')
          records = []
          patterns = {
              '1311': re.compile(r'1311', re.I),
              '948': re.compile(r'948', re.I),
              'niemeier': re.compile(r'Niemeier', re.I),
              'leech': re.compile(r'Leech', re.I),
              'gram': re.compile(r'Gram', re.I),
              'shimura': re.compile(r'Shimura', re.I),
              '79': re.compile(r'79'),
              'lattice': re.compile(r'lattice', re.I),
              'slice': re.compile(r'slice', re.I),
          }
          for path in sorted((root / 'source').rglob('*')):
              if not path.is_file():
                  continue
              try:
                  lines = path.read_text(errors='replace').splitlines()
              except Exception:
                  continue
              for number, line in enumerate(lines, 1):
                  hits = [name for name, pattern in patterns.items() if pattern.search(line)]
                  if hits:
                      lo = max(0, number - 4)
                      hi = min(len(lines), number + 3)
                      records.append({
                          'file': str(path.relative_to(root / 'source')),
                          'line': number,
                          'hits': hits,
                          'context': lines[lo:hi],
                      })
          payload = {
              'source_file_count': len([p for p in (root / 'source').rglob('*') if p.is_file()]),
              'match_record_count': len(records),
              'records': records,
          }
          (root / 'source-index.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps({k: payload[k] for k in ('source_file_count', 'match_record_count')}, indent=2))
          PY
          tar -C "$out/source" -czf "$out/0709.2908-extracted-source.tar.gz" .
          sha256sum "$out/0709.2908-extracted-source.tar.gz" >> "$out/source.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elkies-0709.2908-primary-source
          path: /tmp/elkies-primary-source
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
