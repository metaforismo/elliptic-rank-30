name: probe-sage-quaternion-order-api

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-rank29-height-lattice.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
      - name: Introspect quaternion algebra and order APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sage-quaternion-order-api
          cat > /tmp/probe.py <<'PY'
          from __future__ import annotations

          import inspect
          import json
          import traceback
          from pathlib import Path

          from sage.all import QQ, QuaternionAlgebra, version

          OUT = Path('/tmp/sage-quaternion-order-api')
          payload = {'sage_version': str(version()), 'status': 'started'}

          def public_methods(obj):
              return sorted(name for name in dir(obj) if not name.startswith('_'))

          def source(obj):
              try:
                  return inspect.getsource(obj)
              except Exception as exc:
                  return f'UNAVAILABLE: {exc!r}'

          try:
              presentations = []
              for a in range(-20, 21):
                  if a in (-1, 0, 1):
                      continue
                  for b in range(-20, 21):
                      if b in (-1, 0, 1):
                          continue
                      A0 = QuaternionAlgebra(QQ, a, b)
                      finite, infinite = A0.ramified_places()
                      if [int(p) for p in finite] == [2, 3] and not infinite:
                          presentations.append((abs(a)+abs(b), abs(a*b), a, b))
              _, _, a, b = min(presentations)
              A = QuaternionAlgebra(QQ, a, b, names=('i','j','k'))
              O = A.maximal_order(take_shortcuts=False)
              I = O.unit_ideal()

              payload.update({
                  'status': 'completed',
                  'presentation': {'a': a, 'b': b},
                  'algebra_methods': public_methods(A),
                  'order_methods': public_methods(O),
                  'ideal_methods': public_methods(I),
                  'order_with_level_source': source(A.order_with_level),
                  'maximal_order_source': source(A.maximal_order),
                  'order_source': source(A.order),
                  'order_class': str(type(O)),
                  'ideal_class': str(type(I)),
                  'order_constructor_signature': str(inspect.signature(A.order)),
                  'left_ideal_signature': str(inspect.signature(O.left_ideal)),
                  'right_ideal_signature': str(inspect.signature(O.right_ideal)),
                  'maximal_order_basis': [str(x) for x in O.basis()],
                  'maximal_order_discriminant': str(O.discriminant()),
                  'unit_ideal_left_order': [str(x) for x in I.left_order().basis()],
                  'unit_ideal_right_order': [str(x) for x in I.right_order().basis()],
              })

              interesting = [
                  'intersection', 'intersect', 'basis_matrix', 'free_module',
                  'left_ideal', 'right_ideal', 'left_order', 'right_order',
                  'is_equivalent', 'equivalent', 'cyclic_right_subideals',
                  'cyclic_left_subideals', 'ideal', 'order', 'p_neighbors',
                  'neighbors', 'prime_ideal', 'random_element', 'conjugate',
              ]
              payload['interesting_method_sources'] = {}
              for name in interesting:
                  for owner_name, owner in [('algebra', A), ('order', O), ('ideal', I)]:
                      if hasattr(owner, name):
                          method = getattr(owner, name)
                          payload['interesting_method_sources'][f'{owner_name}.{name}'] = {
                              'signature': str(inspect.signature(method)) if callable(method) else None,
                              'source': source(method),
                          }
          except Exception as exc:
              payload.update({'status': 'error', 'error': repr(exc), 'traceback': traceback.format_exc()})

          (OUT / 'api.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'status': payload.get('status'),
              'presentation': payload.get('presentation'),
              'order_class': payload.get('order_class'),
              'ideal_class': payload.get('ideal_class'),
              'error': payload.get('error'),
          }, indent=2, sort_keys=True))
          if payload.get('status') != 'completed':
              raise SystemExit(1)
          PY
          sage -python /tmp/probe.py | tee /tmp/sage-quaternion-order-api/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sage-quaternion-order-api
          path: /tmp/sage-quaternion-order-api
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
