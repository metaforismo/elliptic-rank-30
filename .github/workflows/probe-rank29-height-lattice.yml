name: probe-rank29-height-lattice

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-rank29-height-lattice.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
      - name: Compute the rank-29 canonical-height lattice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rank29-height-lattice
          cat > /tmp/rank29_height_lattice.py <<'PY'
          from __future__ import annotations

          import hashlib
          import heapq
          import itertools
          import json
          import time
          import traceback
          from pathlib import Path

          from sage.all import EllipticCurve, Matrix, QQ, RealField, ZZ, matrix, vector, version

          OUT = Path('/tmp/rank29-height-lattice')
          PRECISION = 160
          result = {
              'status': 'started',
              'sage_version': str(version()),
              'precision_bits': PRECISION,
              'truth_status': 'experimental height-lattice reconstruction; not a rank-30 certificate',
          }

          def decimal(value, digits=45):
              return str(value.n(digits=digits))

          def canonical_sign(values):
              values = tuple(int(v) for v in values)
              for value in values:
                  if value:
                      return values if value > 0 else tuple(-v for v in values)
              return values

          try:
              started = time.time()
              curve = json.loads(Path('curve.json').read_text())
              point_data = json.loads(Path('points.json').read_text())
              E = EllipticCurve(QQ, [QQ(v) for v in curve['model']['a_invariants']])
              labels, points = [], []
              for label, xn, xd, yn, yd in point_data['points']:
                  labels.append(label)
                  points.append(E(QQ(xn) / QQ(xd), QQ(yn) / QQ(yd)))
              if len(points) != 29:
                  raise AssertionError(f'expected 29 points, got {len(points)}')

              RR = RealField(PRECISION)
              H = Matrix(RR, E.height_pairing_matrix(points, precision=PRECISION))
              eigenvalues = sorted(RR(v) for v in H.eigenvalues())
              if eigenvalues[0] <= 0:
                  raise AssertionError(('height matrix not positive definite', eigenvalues[:3]))

              reduced_points, U = E.lll_reduce(points, height_matrix=H)
              U = Matrix(ZZ, U)
              transform_ok = all(
                  sum((U[i, j] * points[i] for i in range(29)), E(0)) == reduced_points[j]
                  for j in range(29)
              )
              if not transform_ok or abs(U.det()) != 1:
                  raise AssertionError(('bad LLL transformation', transform_ok, U.det()))
              Hred = U.transpose() * H * U
              Hred_check = Matrix(RR, E.height_pairing_matrix(reduced_points, precision=PRECISION))
              pairing_error = max(abs(Hred[i, j] - Hred_check[i, j]) for i in range(29) for j in range(29))

              reduced_heights = [Hred[i, i] for i in range(29)]
              order = sorted(range(29), key=lambda i: reduced_heights[i])
              gaps = []
              for k in range(1, 29):
                  left = reduced_heights[order[k - 1]]
                  right = reduced_heights[order[k]]
                  gaps.append({
                      'after_rank': k,
                      'ratio': decimal(right / left),
                      'difference': decimal(right - left),
                      'left_height': decimal(left),
                      'right_height': decimal(right),
                  })

              # Deterministic bounded enumeration in the LLL basis.
              keep = 1500
              heap = []
              seen = set()
              counter = [0]
              diagonal = [Hred[i, i] for i in range(29)]

              def consider(indices, signs):
                  counter[0] += 1
                  coeff = [0] * 29
                  for index, sign in zip(indices, signs):
                      coeff[index] = int(sign)
                  key = canonical_sign(coeff)
                  if key in seen:
                      return
                  seen.add(key)
                  height = sum(diagonal[i] for i in indices)
                  for a in range(len(indices)):
                      for b in range(a + 1, len(indices)):
                          height += 2 * signs[a] * signs[b] * Hred[indices[a], indices[b]]
                  item = (-height, key)
                  if len(heap) < keep:
                      heapq.heappush(heap, item)
                  elif height < -heap[0][0]:
                      heapq.heapreplace(heap, item)

              for support in range(1, 5):
                  for indices in itertools.combinations(range(29), support):
                      for signs in itertools.product((-1, 1), repeat=support):
                          consider(indices, signs)

              short = sorted([(-neg, coeff) for neg, coeff in heap], key=lambda item: (item[0], item[1]))
              short_records = []
              original_vectors = []
              for height, coeff in short:
                  rv = vector(ZZ, coeff)
                  ov = U * rv
                  original_vectors.append(ov)
                  short_records.append({
                      'height': decimal(height),
                      'reduced_coefficients': [int(v) for v in rv],
                      'original_coefficients': [int(v) for v in ov],
                      'support': int(sum(v != 0 for v in rv)),
                  })

              # Greedy successive-minima approximation from the bounded list.
              selected_positions = []
              rows = Matrix(ZZ, 0, 29)
              for position, ov in enumerate(original_vectors):
                  trial = rows.stack(matrix(ZZ, 1, 29, list(ov)))
                  if trial.rank() > rows.rank():
                      rows = trial
                      selected_positions.append(position)
                  if len(selected_positions) == 29:
                      break
              if len(selected_positions) != 29:
                  raise AssertionError(('retained vectors span only', len(selected_positions)))

              C = Matrix(ZZ, 29, 29, [
                  original_vectors[position][i]
                  for i in range(29)
                  for position in selected_positions
              ])
              C17 = C[:, :17]
              H17 = C17.transpose() * H * C17
              candidate17_points = [
                  sum((C17[i, j] * points[i] for i in range(29)), E(0))
                  for j in range(17)
              ]
              H17_check = Matrix(RR, E.height_pairing_matrix(candidate17_points, precision=PRECISION))
              H17_error = max(abs(H17[i, j] - H17_check[i, j]) for i in range(17) for j in range(17))

              Hselected = C.transpose() * H * C
              A = Hselected[:17, :17]
              B = Hselected[:17, 17:]
              D = Hselected[17:, 17:]
              schur = D - B.transpose() * A.inverse() * B
              schur_eigenvalues = sorted(RR(v) for v in schur.eigenvalues())

              result.update({
                  'status': 'completed',
                  'curve_candidate_id': curve['candidate_id'],
                  'point_count': 29,
                  'point_labels': labels,
                  'height_pairing_matrix': [[decimal(H[i, j]) for j in range(29)] for i in range(29)],
                  'regulator_numeric': decimal(H.det()),
                  'minimum_eigenvalue_numeric': decimal(eigenvalues[0]),
                  'maximum_eigenvalue_numeric': decimal(eigenvalues[-1]),
                  'condition_number_numeric': decimal(eigenvalues[-1] / eigenvalues[0]),
                  'lll_transform_columns': [[int(U[i, j]) for j in range(29)] for i in range(29)],
                  'lll_transform_determinant': int(U.det()),
                  'lll_transform_verified_exactly': transform_ok,
                  'lll_pairing_recomputation_max_error': decimal(pairing_error),
                  'lll_reduced_basis': [
                      {
                          'basis_index': i,
                          'height': decimal(reduced_heights[i]),
                          'original_coefficients': [int(U[row, i]) for row in range(29)],
                      }
                      for i in order
                  ],
                  'successive_height_gaps': gaps,
                  'bounded_short_vector_probe': {
                      'support_bound': 4,
                      'coefficient_alphabet': [-1, 0, 1],
                      'enumerated_signed_vectors_before_sign_deduplication': counter[0],
                      'retained_vectors': len(short_records),
                      'short_vectors': short_records,
                  },
                  'greedy_short_basis': {
                      'selected_short_vector_positions': selected_positions,
                      'coefficient_matrix_columns': [[int(C[i, j]) for j in range(29)] for i in range(29)],
                      'determinant_absolute_value': int(abs(C.det())),
                  },
                  'candidate_rank17_sublattice': {
                      'truth_status': 'experimental candidate selected by bounded short-vector geometry; generic provenance unproved',
                      'short_vector_positions': selected_positions[:17],
                      'coefficient_matrix_columns': [[int(C17[i, j]) for j in range(17)] for i in range(29)],
                      'height_pairing_matrix': [[decimal(H17[i, j]) for j in range(17)] for i in range(17)],
                      'regulator_numeric': decimal(H17.det()),
                      'recomputation_max_error': decimal(H17_error),
                  },
                  'complement_relative_to_candidate17': {
                      'schur_complement_eigenvalues': [decimal(v) for v in schur_eigenvalues],
                      'minimum_residual_eigenvalue': decimal(schur_eigenvalues[0]),
                      'determinant_numeric': decimal(schur.det()),
                  },
                  'elapsed_seconds': time.time() - started,
              })
          except Exception as exc:
              result.update({'status': 'error', 'error': repr(exc), 'traceback': traceback.format_exc()})

          raw = json.dumps(result, sort_keys=True, separators=(',', ':')).encode()
          result['record_sha256'] = hashlib.sha256(raw).hexdigest()
          (OUT / 'rank29-height-lattice.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          summary = {
              'status': result.get('status'),
              'record_sha256': result.get('record_sha256'),
              'elapsed_seconds': result.get('elapsed_seconds'),
              'minimum_eigenvalue_numeric': result.get('minimum_eigenvalue_numeric'),
              'candidate17_regulator_numeric': (result.get('candidate_rank17_sublattice') or {}).get('regulator_numeric'),
              'error': result.get('error'),
          }
          (OUT / 'stdout-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          if result.get('status') != 'completed':
              raise SystemExit(1)
          PY
          sage -python /tmp/rank29_height_lattice.py | tee /tmp/rank29-height-lattice/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank29-height-lattice
          path: /tmp/rank29-height-lattice
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
