name: import-canonical-now

on:
  push:
    paths:
      - ".github/workflows/import-canonical-now.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate and verify canonical package in Git history
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            curve.json
            points.json
            verify_exact.py
            rank_packet_obstruction_tests.py
            paper/paper.tex
          )

          : > /tmp/history-candidates.txt
          for commit in $(git rev-list --all --date-order); do
            ok=1
            for path in "${required[@]}"; do
              git cat-file -e "$commit:$path" 2>/dev/null || { ok=0; break; }
            done
            if test "$ok" = 1; then
              printf '%s\t%s\n' "$commit" "$(git show -s --format='%cI %s' "$commit")" \
                | tee -a /tmp/history-candidates.txt
            fi
          done

          test -s /tmp/history-candidates.txt || {
            echo "No commit in reachable Git history contains the required package." >&2
            exit 1
          }

          recovered=""
          while IFS=$'\t' read -r commit metadata; do
            echo "Testing historical package $commit ($metadata)"
            rm -rf /tmp/canonical-tree
            mkdir -p /tmp/canonical-tree
            git archive "$commit" | tar -x -C /tmp/canonical-tree

            if (
              set -euo pipefail
              cd /tmp/canonical-tree
              python3 verify_exact.py
              python3 rank_packet_obstruction_tests.py
              if test -f research/packet3_certificate.py; then
                mkdir -p certificates
                python3 research/packet3_certificate.py \
                  --output certificates/packet3_certificate.json
              fi
              python3 -m unittest discover -s tests -v
            ); then
              recovered="$commit"
              break
            fi
            echo "Historical package $commit failed verification; continuing." >&2
          done < /tmp/history-candidates.txt

          test -n "$recovered" || {
            echo "No historical package passed the exact verification suite." >&2
            exit 1
          }
          echo "$recovered" > /tmp/recovered-commit.txt
          echo "Recovered verified package from $recovered"

      - name: Replace main with the verified package
        shell: bash
        run: |
          set -euo pipefail
          recovered=$(cat /tmp/recovered-commit.txt)
          rm -rf /tmp/canonical-tree
          mkdir -p /tmp/canonical-tree
          git archive "$recovered" | tar -x -C /tmp/canonical-tree

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/canonical-tree/. .

          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-import.yml
          rm -f .github/workflows/bootstrap-import-final.yml
          rm -f .github/workflows/bootstrap-import-final-v2.yml
          rm -f .github/workflows/bootstrap-import-corrected.yml
          rm -f .github/workflows/issue-bootstrap-dispatch.yml
          rm -f .github/workflows/history-cleanup.yml
          rm -f .github/workflows/apply-packet3-theorem.yml
          rm -f .github/workflows/import-canonical-now.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find paper -maxdepth 1 -type f \
            \( -name '*.aux' -o -name '*.log' -o -name '*.out' -o -name '*.toc' -o -name '*.fls' -o -name '*.fdb_latexmk' -o -name '*.synctex.gz' \) \
            -delete 2>/dev/null || true

          printf '%s\n' "$recovered" > RECOVERED_FROM_COMMIT

      - name: Verify recovered package from repository root
        shell: bash
        run: |
          set -euo pipefail
          python3 verify_exact.py
          python3 rank_packet_obstruction_tests.py
          if test -f research/packet3_certificate.py; then
            mkdir -p certificates
            python3 research/packet3_certificate.py \
              --output certificates/packet3_certificate.json
          fi
          python3 -m unittest discover -s tests -v

      - name: Rebuild repository manifest
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f ! -path './.git/*' ! -name 'MANIFEST.sha256' \
            -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256

      - name: Commit canonical main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && {
            echo "Historical recovery produced no repository changes" >&2
            exit 1
          }
          git commit -m "Restore the verified certificate-first research package"
          git push
