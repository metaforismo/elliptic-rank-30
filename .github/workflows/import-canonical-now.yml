name: import-canonical-now

on:
  push:
    paths:
      - ".github/workflows/import-canonical-now.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and inspect canonical archive
        shell: bash
        run: |
          set -euo pipefail
          archive_b64=/tmp/elliptic-rank-30-source.tar.xz.b64
          archive=/tmp/elliptic-rank-30-source.tar.xz

          cat \
            bootstrap/payload.part.000 \
            bootstrap/payload.part.001 \
            bootstrap/payload.part.002.00 \
            bootstrap/payload.part.002.tail \
            bootstrap/payload.part.003 \
            bootstrap/payload.part.004 \
            bootstrap/payload.part.005 \
            bootstrap/payload.part.006.00 \
            bootstrap/payload.part.006.01 \
            bootstrap/payload.part.006.02 \
            bootstrap/payload.part.006.03 \
            bootstrap/payload.part.006.04.00 \
            bootstrap/payload.part.006.04.01 \
            bootstrap/payload.part.006.04.02 \
            bootstrap/payload.part.006.04.03 \
            bootstrap/payload.part.007.00.00 \
            bootstrap/payload.part.007.00.01 \
            bootstrap/payload.part.007.00.02 \
            bootstrap/payload.part.007.00.03 \
            bootstrap/payload.part.007.01.00 \
            bootstrap/payload.part.007.01.01 \
            bootstrap/payload.part.007.01.02 \
            bootstrap/payload.part.007.01.03 \
            > "$archive_b64"

          test "$(wc -c < "$archive_b64")" = "147468"
          base64 --decode "$archive_b64" > "$archive"
          test "$(wc -c < "$archive")" = "110600"

          echo "Transport digest: $(sha256sum "$archive_b64" | cut -d' ' -f1)"
          echo "Archive digest:   $(sha256sum "$archive" | cut -d' ' -f1)"
          xz --test "$archive"

          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          archive = "/tmp/elliptic-rank-30-source.tar.xz"
          with tarfile.open(archive, "r:xz") as bundle:
              members = bundle.getmembers()
              if not members:
                  raise SystemExit("canonical archive is empty")
              names = set()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name!r}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"archive links are not allowed: {member.name!r}")
                  if member.name in names:
                      raise SystemExit(f"duplicate archive member: {member.name!r}")
                  names.add(member.name)
              print(f"Validated {len(members)} archive members")
              for name in sorted(names):
                  print(name)
          PY

          mkdir -p /tmp/canonical-tree
          tar --extract --xz --file "$archive" --directory /tmp/canonical-tree \
            --no-same-owner --no-same-permissions

      - name: Validate staged package before overlay
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/canonical-tree
          required=(
            README.md
            curve.json
            points.json
            verify_exact.py
            rank_packet_obstruction_tests.py
            paper/paper.tex
          )
          for path in "${required[@]}"; do
            test -f "$path" || {
              echo "Missing required canonical artifact: $path" >&2
              exit 1
            }
          done
          python3 verify_exact.py
          python3 rank_packet_obstruction_tests.py
          if test -f research/packet3_certificate.py; then
            python3 research/packet3_certificate.py --output certificates/packet3_certificate.json
          fi
          python3 -m unittest discover -s tests -v

      - name: Overlay validated package
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/canonical-tree/. .

      - name: Remove temporary transport and failed one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-import.yml
          rm -f .github/workflows/bootstrap-import-final.yml
          rm -f .github/workflows/bootstrap-import-final-v2.yml
          rm -f .github/workflows/bootstrap-import-corrected.yml
          rm -f .github/workflows/issue-bootstrap-dispatch.yml
          rm -f .github/workflows/history-cleanup.yml
          rm -f .github/workflows/apply-packet3-theorem.yml
          rm -f .github/workflows/import-canonical-now.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find paper -maxdepth 1 -type f \
            \( -name '*.aux' -o -name '*.log' -o -name '*.out' -o -name '*.toc' -o -name '*.fls' -o -name '*.fdb_latexmk' -o -name '*.synctex.gz' \) \
            -delete 2>/dev/null || true

      - name: Verify imported package from repository root
        shell: bash
        run: |
          set -euo pipefail
          python3 verify_exact.py
          python3 rank_packet_obstruction_tests.py
          if test -f research/packet3_certificate.py; then
            python3 research/packet3_certificate.py --output certificates/packet3_certificate.json
          fi
          python3 -m unittest discover -s tests -v

      - name: Rebuild repository manifest
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \
            ! -path './.git/*' \
            ! -name 'MANIFEST.sha256' \
            -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256

      - name: Commit canonical tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Import produced no repository changes" >&2
            exit 1
          fi
          git commit -m "Import the verified certificate-first research package"
          git push
