name: Export historic Hensel snapshot

on:
  push:
    branches:
      - recovery/hensel-evidence-20260812

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked checkout
        run: git archive --format=zip --output=historic-hensel-snapshot.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: historic-hensel-snapshot
          path: historic-hensel-snapshot.zip
          if-no-files-found: error
          retention-days: 1
