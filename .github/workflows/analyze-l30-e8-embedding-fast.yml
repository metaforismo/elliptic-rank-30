name: analyze-l30-e8-embedding-fast

on:
  push:
    paths:
      - "research/l30_e8_embedding_fast.sage.py"
      - "research/l30_e8_embedding.sage.py"
      - ".github/workflows/analyze-l30-e8-embedding-fast.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run the exact PARI/bitset E8(3) embedding search
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certificates
          timeout 50m sage -python research/l30_e8_embedding_fast.sage.py \
            --central-limit 6660 \
            --output certificates/l30_e8_embedding_fast.json
      - uses: actions/upload-artifact@v4
        with:
          name: l30-e8-embedding-fast-certificate
          path: certificates/l30_e8_embedding_fast.json
          if-no-files-found: error
      - name: Preserve the exact fast lattice certificate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/l30_e8_embedding_fast.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record the optimized E8(3) embedding certificate"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
