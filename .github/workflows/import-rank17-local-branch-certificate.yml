      - name: Recompute the certificate from mathematics
        run: |
          set -euo pipefail
          python3 research/rank17_section_local_branch_f7.py \
            --compare certificates/rank17_section_local_branch_f7.json

      - name: Register the verifier in exact CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/verify.yml')
          text = path.read_text()
          marker = '      - name: Run exact unit tests\n        run: python3 -m unittest discover -s tests -v\n'
          step = '      - name: Recompute the local F7 rank-17 section-incidence certificate\n        run: |\n          python3 research/rank17_section_local_branch_f7.py \\\n            --compare certificates/rank17_section_local_branch_f7.json\n\n'
          if 'rank17_section_local_branch_f7.py' not in text:
              if marker not in text:
                  raise SystemExit('verify.yml insertion marker not found')
              path.write_text(text.replace(marker, step + marker, 1))
          PY

      - name: Run exact verification and unit tests
        run: |
          set -euo pipefail
          python3 verify_exact.py
          python3 research/rank17_section_local_branch_f7.py \
            --compare certificates/rank17_section_local_branch_f7.json
          python3 -m unittest discover -s tests -v

      - name: Remove one-shot importer and commit the canonical result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-rank17-local-branch-certificate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo "no import delta" >&2; exit 1; }
          git commit -m "Certify the local F7 rank-17 section-incidence point"
          git push
