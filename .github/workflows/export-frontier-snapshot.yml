name: export-frontier-snapshot

on:
  push:
    paths:
      - ".github/workflows/export-frontier-snapshot.yml"

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > HEAD.txt
          git status --short > STATUS.txt
          git bundle create elliptic-rank-30-frontier.bundle --all
          git archive --format=tar.gz --output=elliptic-rank-30-frontier.tar.gz HEAD
          sha256sum HEAD.txt STATUS.txt elliptic-rank-30-frontier.bundle elliptic-rank-30-frontier.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: elliptic-rank-30-frontier-snapshot
          path: |
            HEAD.txt
            STATUS.txt
            SHA256SUMS
            elliptic-rank-30-frontier.bundle
            elliptic-rank-30-frontier.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
