name: apply-hodge-paper-section

on:
  push:
    paths:
      - ".github/workflows/apply-hodge-paper-section.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert the Hodge chapter
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "$GITHUB_REF_NAME"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('paper/source/main.tex')
          text=path.read_text()
          marker='\\input{paper/source/05_cyclic_cubic}\n'
          insertion=marker+'\\input{paper/source/05a_hodge_representation}\n'
          if '\\input{paper/source/05a_hodge_representation}' not in text:
              if marker not in text:
                  raise SystemExit('cyclic cubic chapter marker not found')
              path.write_text(text.replace(marker,insertion,1))
          PY
          rm -f .github/workflows/apply-hodge-paper-section.yml
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Build and preflight
        shell: bash
        run: |
          set -euo pipefail
          cp paper/source/main.tex paper/paper.tex
          rm -rf paper/build && mkdir -p paper/build
          latexmk -pdf -interaction=nonstopmode -halt-on-error \
            -output-directory=paper/build paper/paper.tex
          cp paper/build/paper.pdf paper/paper.pdf
          pdftotext paper/paper.pdf /tmp/paper.txt
          grep -F 'Francesco Giannicola' /tmp/paper.txt
          grep -F 'order-three Hodge representation' /tmp/paper.txt
          grep -F 'new intermediate theorem' /tmp/paper.txt
          rm -rf paper/build
      - name: Persist the chapter and PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add the C3 Hodge representation to the paper"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
