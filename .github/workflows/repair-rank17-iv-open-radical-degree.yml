name: Repair the pre-solved IV quotient degree

on:
  push:
    branches:
      - research/certified-modular-elimination
    paths:
      - ".github/workflows/repair-rank17-iv-open-radical-degree.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the unique exact correction and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('research/rank17_iv_open_component_radical_membership_sage.py')
          source = path.read_text(encoding='utf-8')
          old = 'if quotient.degree() != 13:\n            raise AssertionError(("unexpected quotient degree", quotient.degree()))'
          new = 'if quotient.degree() != 11:\n            raise AssertionError(("unexpected pre-solved quotient degree", quotient.degree()))'
          if source.count(old) != 1:
              raise AssertionError(('repair site changed', source.count(old)))
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-rank17-iv-open-radical-degree.yml
          git add research/rank17_iv_open_component_radical_membership_sage.py
          git commit -m "Fix the pre-solved IV differential quotient degree"
          git push origin HEAD:research/certified-modular-elimination
