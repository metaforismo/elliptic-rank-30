name: search-cyclic-trisection-batch-2

on:
  push:
    paths:
      - ".github/workflows/search-cyclic-trisection-batch-2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {prime: 5, start: 200, count: 25, pattern: linear-linear}
          - {prime: 5, start: 225, count: 25, pattern: linear-linear}
          - {prime: 5, start: 250, count: 25, pattern: linear-linear}
          - {prime: 5, start: 275, count: 25, pattern: linear-linear}
          - {prime: 5, start: 0, count: 25, pattern: quadratic-constant}
          - {prime: 5, start: 25, count: 25, pattern: quadratic-constant}
          - {prime: 5, start: 0, count: 25, pattern: constant-quadratic}
          - {prime: 5, start: 25, count: 25, pattern: constant-quadratic}
          - {prime: 7, start: 0, count: 10, pattern: linear-linear}
          - {prime: 7, start: 10, count: 10, pattern: linear-linear}
          - {prime: 7, start: 20, count: 10, pattern: linear-linear}
          - {prime: 7, start: 30, count: 10, pattern: linear-linear}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
      - name: Normalize exact split-E8 input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p search/results
          sage -python search/normalize_kumar_shioda_certificate.py \
            --source certificates/kumar_shioda_split_e8_certificate.json \
            --output search/results/kumar_shioda_normalized.json
      - name: Search one trace block
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          slug='p${{ matrix.prime }}_${{ matrix.start }}_${{ matrix.pattern }}'
          timeout 140m sage -python search/sage_search_cyclic_trisection_trace_blocks.py \
            --prime '${{ matrix.prime }}' \
            --trace-start '${{ matrix.start }}' \
            --trace-count '${{ matrix.count }}' \
            --pattern '${{ matrix.pattern }}' \
            --max-hits 100 \
            --normalized search/results/kumar_shioda_normalized.json \
            --output "search/results/cyclic_trace_batch2_${slug}.json" \
            2>&1 | tee "search/results/cyclic_trace_batch2_${slug}.log"
      - name: Preserve a fail-closed worker record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p='${{ matrix.prime }}'; start='${{ matrix.start }}'; pattern='${{ matrix.pattern }}'
          path=Path(f'search/results/cyclic_trace_batch2_p{p}_{start}_{pattern}.json')
          if not path.exists():
              path.write_text(json.dumps({
                  'status':'worker_failed_without_json','prime':int(p),
                  'trace_start':int(start),'pattern':pattern,
                  'truth_status':'no mathematical claim'},indent=2,sort_keys=True)+'\n')
          d=json.loads(path.read_text())
          print(json.dumps({
              'status':d.get('status'),'prime':d.get('prime'),
              'trace_start':d.get('trace_start'),'hits':d.get('hit_count'),
              'smooth_genus_one_hits':d.get('genus_one_smooth_branch_hit_count'),
              'error':d.get('error')},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyclic-trace-batch2-p${{ matrix.prime }}-${{ matrix.start }}-${{ matrix.pattern }}
          path: |
            search/results/cyclic_trace_batch2_p${{ matrix.prime }}_${{ matrix.start }}_${{ matrix.pattern }}.json
            search/results/cyclic_trace_batch2_p${{ matrix.prime }}_${{ matrix.start }}_${{ matrix.pattern }}.log
          if-no-files-found: error

  consolidate:
    if: always()
    needs: search
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: cyclic-trace-batch2-*
          merge-multiple: true
          path: search/results
      - name: Consolidate, preserve evidence, and remove the one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "$GITHUB_REF_NAME"
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[]; hits=[]
          for path in sorted(Path('search/results').glob('cyclic_trace_batch2_*.json')):
              d=json.loads(path.read_text())
              rows.append({
                  'file':path.name,'status':d.get('status'),'prime':d.get('prime'),
                  'trace_start':d.get('trace_start'),'pattern':d.get('pattern'),
                  'selected_trace_count':d.get('selected_trace_count'),
                  'hit_count':d.get('hit_count'),
                  'genus_one_smooth_branch_hit_count':d.get('genus_one_smooth_branch_hit_count'),
                  'error':d.get('error'),'elapsed_seconds':d.get('elapsed_seconds')})
              for hit in d.get('hits',[]): hits.append({'source':path.name,**hit})
          hits.sort(key=lambda h:(
              h.get('extension_genus')!=1,
              h.get('branch_collision_detected') is not False,
              h.get('prime',999),h.get('trace_index',10**9)))
          out={
              'status':'pass' if rows else 'no_artifacts','runs':rows,
              'traces_attempted':sum(r.get('selected_trace_count') or 0 for r in rows),
              'total_hits':len(hits),
              'genus_one_smooth_branch_hits':sum(
                  h.get('extension_genus')==1 and h.get('branch_collision_detected') is False
                  for h in hits),
              'top_hits':hits[:300],
              'truth_status':'finite-characteristic lifting seeds only; no Q(t) or rank-30 claim'}
          Path('search/cyclic_trisection_batch2_summary.json').write_text(
              json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:out[k] for k in (
              'status','traces_attempted','total_hits','genus_one_smooth_branch_hits')},sort_keys=True))
          PY
          rm -f .github/workflows/search-cyclic-trisection-batch-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record the second cyclic trisection trace scan"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
