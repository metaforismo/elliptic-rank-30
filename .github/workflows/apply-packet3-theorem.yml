name: apply-packet3-theorem

on:
  push:
    paths:
      - ".github/workflows/apply-packet3-theorem.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the exact theorem update
        shell: bash
        run: |
          set -euo pipefail
          python3 research/apply_packet3_update.py
          python3 research/packet3_certificate.py \
            --output certificates/packet3_certificate.json

      - name: Compile the living paper
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended
          cd paper
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          rm -f *.aux *.log *.out *.toc *.fls *.fdb_latexmk *.synctex.gz

      - name: Rebuild and verify the repository manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-packet3-theorem.yml
          find . -type f \
            ! -path './.git/*' \
            ! -name 'MANIFEST.sha256' \
            -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > MANIFEST.sha256

          python3 verify_exact.py
          python3 rank_packet_obstruction_tests.py
          python3 research/packet3_certificate.py \
            --output certificates/packet3_certificate.json
          python3 -m unittest discover -s tests -v
          sha256sum -c MANIFEST.sha256

      - name: Commit the theorem, certificate, and updated paper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Prove a genus-zero three-channel rank packet"
          git push
