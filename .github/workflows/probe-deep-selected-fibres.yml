name: probe-deep-selected-fibres

on:
  push:
    branches:
      - research/deep-split-quartic-20260810-v2
    paths:
      - "research/sage_deep_selected_fibre_search.py"
      - ".github/workflows/probe-deep-selected-fibres.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search selected split fibres deeply
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/results
          sage -python research/sage_deep_selected_fibre_search.py \
            --input research/results/deep_split_quartic_search.json \
            --output research/results/deep_selected_fibre_search.json \
            --curves 5 \
            --timeout 600 \
            --prime-bound 1000 \
            | tee /tmp/deep-selected-fibre-search.log
      - name: Commit bounded result on temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/deep_selected_fibre_search.json
          git diff --cached --quiet && exit 0
          git commit -m "Record deep selected-fibre search"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-selected-fibre-search
          path: |
            research/results/deep_selected_fibre_search.json
            /tmp/deep-selected-fibre-search.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
