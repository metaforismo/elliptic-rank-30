# Checkpoint rerun with the corrected primitive mod-19 determinant quintic.
name: complete-polynomial-checkpoint

on:
  push:
    paths:
      - ".github/workflows/complete-polynomial-checkpoint.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: complete-polynomial-checkpoint
  cancel-in-progress: false

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned exact symbolic dependency
        run: python3 -m pip install --disable-pip-version-check 'sympy==1.13.3'

      - name: Recompute proof-critical standard-library certificates
        shell: bash
        run: |
          set -euo pipefail
          python3 research/degree24_polynomial_section_obstruction.py \
            --check certificates/degree24_polynomial_section_obstruction.json
          python3 research/degree24_polynomial_section_classification.py \
            --check certificates/degree24_polynomial_section_classification.json
          python3 research/degree24_collision_descent.py \
            --check certificates/degree24_collision_descent.json
          python3 research/polynomial_section_mason_bound.py \
            --check certificates/polynomial_section_mason_bound.json
          python3 research/degree47_degenerate_obstruction.py \
            --check certificates/degree47_degenerate_obstruction.json
          python3 research/degree47_target_mod19_obstruction.py \
            --check certificates/degree47_target_mod19_obstruction.json

      - name: Complete exact finite search and dessin enumeration
        shell: bash
        run: |
          set -euo pipefail
          python3 research/degree24_collision_search.py \
            --numerator-bound 256 \
            --denominator-bound 256 \
            --expect-collisions 0 \
            --output certificates/degree24_collision_search_n256_d256.json
          python3 research/degree47_belyi_passport.py \
            --output certificates/degree47_belyi_passport.json
          python3 research/degree47_belyi_passport.py \
            --check certificates/degree47_belyi_passport.json

      - name: Run independent exact Groebner elimination
        shell: bash
        run: |
          set -euo pipefail
          python3 research/degree47_target_elimination.py \
            --output certificates/degree47_target_elimination.json \
            --expect-result no_rational_solution
          python3 research/degree47_target_elimination.py \
            --check certificates/degree47_target_elimination.json \
            --expect-result no_rational_solution

      - name: Verify the complete mathematical package
        shell: bash
        run: |
          set -euo pipefail
          python3 verify_exact.py
          python3 rank_packet_obstruction_tests.py
          python3 research/packet3_certificate.py \
            --output certificates/packet3_certificate.json
          python3 -m unittest discover -s tests -v

      - name: Finalize evidence-linked project state
        run: python3 research/finalize_polynomial_checkpoint.py

      - name: Remove obsolete one-shot transport and integration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/apply-packet3-theorem.yml
          rm -f .github/workflows/bootstrap-import-corrected.yml
          rm -f .github/workflows/bootstrap-import-final-v2.yml
          rm -f .github/workflows/bootstrap-import-final.yml
          rm -f .github/workflows/bootstrap-import.yml
          rm -f .github/workflows/history-cleanup.yml
          rm -f .github/workflows/import-canonical-now.yml
          rm -f .github/workflows/issue-bootstrap-dispatch.yml
          rm -f .github/workflows/integrate-degree24-research.yml
          rm -f .github/workflows/integrate-degree47-elimination.yml
          rm -f .github/workflows/integrate-degree47-passport.yml
          rm -f .github/workflows/integrate-polynomial-thread-final.yml
          rm -f .github/workflows/integrate-polynomial-thread-v2.yml
          rm -f .github/workflows/complete-polynomial-checkpoint.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Rebuild and verify repository manifest
        shell: bash
        run: |
          set -euo pipefail
          find . -type f ! -path './.git/*' ! -name 'MANIFEST.sha256' \
            -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256

      - name: Package the clean checkpoint
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' -czf /tmp/elliptic-rank-30-polynomial-checkpoint.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: elliptic-rank-30-polynomial-checkpoint
          path: /tmp/elliptic-rank-30-polynomial-checkpoint.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified checkpoint to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No checkpoint changes to commit' >&2; exit 1; }
          git commit -m "Complete the exact polynomial obstruction checkpoint"
          git push
