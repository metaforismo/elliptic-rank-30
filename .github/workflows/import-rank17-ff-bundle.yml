name: import-rank17-finite-field-bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-rank17-ff-bundle.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Decode and verify the exact research bundle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rank17-ff-bundle.b64 <<'B64'
          
          B64
          base64 -d /tmp/rank17-ff-bundle.b64 > /tmp/rank17-ff-bundle.tgz
          tar -xzf /tmp/rank17-ff-bundle.tgz -C .
          python3 research/rank17_semistable_finite_field_certificate.py \
            --source research/rank17_semistable_fiber_search.c \
            --compare certificates/rank17_semistable_finite_field.json

      - name: Commit the verified permanent artifacts to main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-rank17-ff-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/rank17_semistable_fiber_search.c \
            research/rank17_semistable_finite_field_certificate.py \
            certificates/rank17_semistable_finite_field.json \
            .github/workflows/import-rank17-ff-bundle.yml
          git diff --cached --check
          git commit -m "Certify the normalized rank-17 finite-field fibre locus"
          git push origin HEAD:main
