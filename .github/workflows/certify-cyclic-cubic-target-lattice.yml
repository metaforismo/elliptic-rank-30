name: certify-cyclic-cubic-target-lattice

on:
  push:
    paths:
      - "research/cyclic_cubic_target_lattice.sage.py"
      - ".github/workflows/certify-cyclic-cubic-target-lattice.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the rank-30 target lattice and topological gluing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certificates
          sage -python research/cyclic_cubic_target_lattice.sage.py \
            --output certificates/cyclic_cubic_target_lattice.json
      - uses: actions/upload-artifact@v4
        with:
          name: cyclic-cubic-target-lattice
          path: certificates/cyclic_cubic_target_lattice.json
          if-no-files-found: error
