name: integrate-degree47-elimination

on:
  push:
    paths:
      - ".github/workflows/integrate-degree47-elimination.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eliminate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned exact symbolic dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'sympy==1.13.3'

      - name: Recompute structural and combinatorial certificates
        shell: bash
        run: |
          set -euo pipefail
          python3 research/degree24_polynomial_section_obstruction.py \
            --check certificates/degree24_polynomial_section_obstruction.json
          python3 research/degree24_polynomial_section_classification.py \
            --check certificates/degree24_polynomial_section_classification.json
          python3 research/degree24_collision_descent.py \
            --check certificates/degree24_collision_descent.json
          python3 research/polynomial_section_mason_bound.py \
            --check certificates/polynomial_section_mason_bound.json
          python3 research/degree47_degenerate_obstruction.py \
            --check certificates/degree47_degenerate_obstruction.json
          python3 research/degree24_collision_search.py \
            --numerator-bound 256 \
            --denominator-bound 256 \
            --expect-collisions 0 \
            --output certificates/degree24_collision_search_n256_d256.json
          python3 research/degree47_belyi_passport.py \
            --output certificates/degree47_belyi_passport.json

      - name: Eliminate the generic target system exactly
        shell: bash
        run: |
          set -euo pipefail
          python3 research/degree47_target_elimination.py \
            --output certificates/degree47_target_elimination.json
          python3 research/degree47_target_elimination.py \
            --check certificates/degree47_target_elimination.json
          python3 -m unittest discover -s tests -v

      - name: Integrate the exact mathematical outcome
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')
          date = '2026-08-08'
          elimination = json.loads(
              (root / 'certificates/degree47_target_elimination.json').read_text(encoding='utf-8')
          )
          passport = json.loads(
              (root / 'certificates/degree47_belyi_passport.json').read_text(encoding='utf-8')
          )
          result = elimination['result']
          full_solutions = elimination['full_rational_solutions']
          solution_count = len(full_solutions)
          dessin_count = int(passport['dessin_count'])

          if result == 'no_rational_solution':
              state = 'CLOSED_FOR_POLYNOMIAL_IDENTITIES_AT_P_EQUALS_3'
              conclusion = (
                  'The exact Groebner elimination has no rational leading-compatible solution '
                  'in the generic degree-(4,7) branch.  The repeated-root branches are already '
                  'proved impossible.  Combined with the complete degree-(2,4) classification '
                  'and the Mason bound, every polynomial identity of this shape at p=3 is now '
                  'rigorously excluded.'
              )
              next_action = (
                  'Change representation: controlled-pole rational functions, alternative norm '
                  'forms, and the independent K3/high-generic-rank specialization workstreams.'
              )
          elif result == 'rational_solution_found' and solution_count > 0:
              state = 'EXACT_POLYNOMIAL_IDENTITIES_DISCOVERED'
              conclusion = (
                  f'The elimination reconstructed {solution_count} exact rational degree-(4,7) '
                  'identity or identities.  They are not yet rank-30 results; each resulting '
                  'section must be mapped to its elliptic surface, proved non-torsion, and tested '
                  'for independence from the known subgroup.'
              )
              next_action = (
                  'Freeze every displayed L,Q,S tuple, instantiate the corresponding elliptic '
                  'surface, specialize, and run exact Mordell--Weil independence checks.'
              )
          else:
              raise SystemExit(f'inconsistent elimination result: {result}, {solution_count}')

          report = f'''# Exact degree-(4,7) target-elimination result

**Status:** `{state}`.

- Gröbner elimination polynomial degree: `{elimination['elimination_polynomial_degree']}`
- rational roots of the elimination polynomial: `{len(elimination['rational_b_roots'])}`
- rational common `(b,d)` pairs: `{elimination['rational_pair_count']}`
- leading-compatible full identities: `{solution_count}`
- topological dessin classes in the generic passport: `{dessin_count}`
- elimination certificate SHA-256: `{elimination['record_sha256']}`

## Exact conclusion

{conclusion}

## Highest-value next action

{next_action}

All exact factors, roots, pairs, cube-class decisions, reconstructed identities,
and the pinned SymPy version are stored in
`certificates/degree47_target_elimination.json`.
'''
          (root / 'research/degree47_target_elimination_result.md').write_text(
              report, encoding='utf-8'
          )

          def append_section(filename: str, marker: str, section: str) -> None:
              path = root / filename
              text = path.read_text(encoding='utf-8') if path.exists() else f'# {path.stem}\n'
              if marker not in text:
                  path.write_text(text.rstrip() + '\n\n' + section.strip() + '\n', encoding='utf-8')

          append_section(
              'CLAIMS.md',
              'degree47-target-elimination-claim-2026-08-08',
              f'''<!-- degree47-target-elimination-claim-2026-08-08 -->
## Generic maximal target elimination

- Exact generic degree-(4,7) rational elimination: **proved computation**,
  result `{result}`, certificate
  `certificates/degree47_target_elimination.json`.
- Full rational identities reconstructed: **{solution_count}**.
- Repeated-root target branches: **proved impossible**, certificate
  `certificates/degree47_degenerate_obstruction.json`.
- Polynomial thread state: **`{state}`**.
- Rank at least 30: **unknown; not claimed**.'''
          )

          append_section(
              'NEGATIVE_RESULTS.md',
              'degree47-target-elimination-negative-2026-08-08',
              f'''<!-- degree47-target-elimination-negative-2026-08-08 -->
## Exact maximal-target elimination

State: `{state}`.  {conclusion}

This does not cover rational functions with poles and is not a universal rank
bound.'''
          )

          append_section(
              'DECISIONS.md',
              'degree47-target-elimination-decision-2026-08-08',
              f'''<!-- degree47-target-elimination-decision-2026-08-08 -->
## Decision after exact maximal-target elimination

{conclusion}

Canonical next action: {next_action}'''
          )

          append_section(
              'STATUS.md',
              'degree47-target-elimination-status-2026-08-08',
              f'''<!-- degree47-target-elimination-status-2026-08-08 -->
## Exact maximal-target result

- Proved rank lower bound remains `29`.
- Rank-30 certificate remains absent.
- Polynomial inverse-construction state: `{state}`.
- Full degree-(4,7) target identities: `{solution_count}`.
- Exact conclusion: {conclusion}
- Next action: {next_action}'''
          )

          checkpoint_path = root / 'CHECKPOINT.json'
          checkpoint = json.loads(checkpoint_path.read_text(encoding='utf-8')) if checkpoint_path.exists() else {}
          checkpoint['degree47_target_elimination'] = {
              'certificate': 'certificates/degree47_target_elimination.json',
              'result': result,
              'full_solution_count': solution_count,
              'record_sha256': elimination['record_sha256'],
              'state': state,
              'next_action': next_action,
          }
          checkpoint['mathematical_status'] = {
              'best_unconditional_lower_bound': 29,
              'rank_30_found': False,
              'remaining_gap': 1,
          }
          checkpoint['updated'] = date
          checkpoint_path.write_text(json.dumps(checkpoint, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          frontier_path = root / 'STATUS.frontier.json'
          frontier = json.loads(frontier_path.read_text(encoding='utf-8'))
          frontier['authoritative_lower_bound'] = 29
          frontier['record_claim'] = False
          frontier['truth_status'] = 'UNSOLVED: exact rank lower bound 29; no rank-30 certificate'
          frontier['degree47_target_elimination'] = {
              'result': result,
              'full_solution_count': solution_count,
              'state': state,
              'certificate': 'certificates/degree47_target_elimination.json',
              'next_action': next_action,
          }
          frontier['updated'] = date
          frontier_path.write_text(json.dumps(frontier, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          registry_path = root / 'APPROACH_REGISTRY.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          if isinstance(registry, list):
              approaches = registry
          elif isinstance(registry, dict):
              approaches = registry.get('approaches')
              if not isinstance(approaches, list):
                  approaches = registry.get('registry')
              if not isinstance(approaches, list):
                  approaches = []
                  registry['approaches'] = approaches
          else:
              raise SystemExit('unsupported approach registry shape')
          for approach in approaches:
              if not isinstance(approach, dict):
                  continue
              searchable = ' '.join(str(value) for value in approach.values()).lower()
              if 'inverse' not in searchable and 'polynomial' not in searchable:
                  continue
              approach['status'] = state
              approach['concrete_next_test'] = next_action
              approach['missing_lemma'] = (
                  'none for polynomial identities at p=3' if result == 'no_rational_solution'
                  else 'prove the discovered section non-torsion and independent'
              )
              approach['blocker'] = (
                  'representation exhausted; change representation' if result == 'no_rational_solution'
                  else 'elliptic-surface interpretation and Mordell--Weil certification pending'
              )
          registry_path.write_text(json.dumps(registry, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/integrate-degree24-research.yml
          rm -f .github/workflows/integrate-degree47-passport.yml
          rm -f .github/workflows/integrate-polynomial-thread-final.yml
          rm -f .github/workflows/integrate-degree47-elimination.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Reproduce the final exact result
        shell: bash
        run: |
          set -euo pipefail
          python3 research/degree47_target_elimination.py \
            --check certificates/degree47_target_elimination.json
          python3 research/degree47_belyi_passport.py \
            --check certificates/degree47_belyi_passport.json
          python3 research/degree47_degenerate_obstruction.py \
            --check certificates/degree47_degenerate_obstruction.json
          python3 -m unittest discover -s tests -v

      - name: Rebuild manifest, rebase once, and push
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f ! -path './.git/*' ! -name 'MANIFEST.sha256' \
            -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo "No integration changes" >&2; exit 1; }
          git commit -m "Integrate the exact maximal polynomial target elimination"
          git fetch origin main
          git rebase origin/main
          git push
