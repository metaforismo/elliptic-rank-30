name: analyze-l30-character

on:
  push:
    paths:
      - "research/l30_character_scan.g"
      - ".github/workflows/analyze-l30-character.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GAP and the Character Table Library
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gap gap-character-tables
      - name: Scan degree-30 characters and order-three fixed spaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certificates
          gap -q research/l30_character_scan.g > certificates/l30_character_scan.tsv
          python3 - <<'PY'
          import json
          from pathlib import Path

          table_names = [
              "3_2.U4(3).(2^2)_{133}",
              "3_2.U4(3).2_3",
              "3_2.U4(3).2_1",
          ]
          tables = {}
          complex_chars = {}
          rational_chars = {}
          source = Path("certificates/l30_character_scan.tsv")
          for raw in source.read_text(encoding="utf-8").splitlines():
              fields = raw.strip().split("|")
              if not fields or not fields[0]:
                  continue
              kind = fields[0]
              if kind == "TABLE":
                  _, ti, order, class_count = fields
                  ti = int(ti)
                  tables[ti] = {
                      "table": table_names[ti - 1],
                      "group_order": order,
                      "class_count": int(class_count),
                      "degree_30_complex_characters": [],
                      "rationalized_characters_degree_at_most_60": [],
                  }
              elif kind == "CHAR":
                  _, ti, ci = fields
                  key = (int(ti), int(ci))
                  complex_chars[key] = {
                      "character_index": int(ci),
                      "degree": 30,
                      "order_three_classes": [],
                      "has_fixed_rank_8_class": False,
                  }
                  tables[int(ti)]["degree_30_complex_characters"].append(complex_chars[key])
              elif kind == "CLASS":
                  _, ti, ci, class_index, square_index, fixed = fields
                  key = (int(ti), int(ci))
                  fixed = int(fixed)
                  row = {
                      "class_index": int(class_index),
                      "square_class_index": int(square_index),
                      "fixed_multiplicity": fixed,
                      "matches_cyclic_cubic_requirement": fixed == 8,
                  }
                  complex_chars[key]["order_three_classes"].append(row)
                  complex_chars[key]["has_fixed_rank_8_class"] |= fixed == 8
              elif kind == "RAT":
                  _, ti, ri, degree = fields
                  key = (int(ti), int(ri))
                  rational_chars[key] = {
                      "rationalized_character_index": int(ri),
                      "degree": int(degree),
                      "order_three_classes": [],
                      "has_fixed_rank_8_class": False,
                  }
                  tables[int(ti)]["rationalized_characters_degree_at_most_60"].append(
                      rational_chars[key]
                  )
              elif kind == "RCLASS":
                  _, ti, ri, class_index, square_index, fixed = fields
                  key = (int(ti), int(ri))
                  fixed = int(fixed)
                  row = {
                      "class_index": int(class_index),
                      "square_class_index": int(square_index),
                      "fixed_multiplicity": fixed,
                      "matches_cyclic_cubic_requirement": fixed == 8,
                  }
                  rational_chars[key]["order_three_classes"].append(row)
                  rational_chars[key]["has_fixed_rank_8_class"] |= fixed == 8
              else:
                  raise SystemExit(f"unknown GAP record: {raw!r}")

          ordered = [tables[i] for i in sorted(tables)]
          matching_complex = [
              {
                  "table": table["table"],
                  "character_index": char["character_index"],
                  "classes": [
                      row for row in char["order_three_classes"]
                      if row["matches_cyclic_cubic_requirement"]
                  ],
              }
              for table in ordered
              for char in table["degree_30_complex_characters"]
              if char["has_fixed_rank_8_class"]
          ]
          matching_rationalized = [
              {
                  "table": table["table"],
                  "rationalized_character_index": char["rationalized_character_index"],
                  "classes": [
                      row for row in char["order_three_classes"]
                      if row["matches_cyclic_cubic_requirement"]
                  ],
              }
              for table in ordered
              for char in table["rationalized_characters_degree_at_most_60"]
              if char["degree"] == 30 and char["has_fixed_rank_8_class"]
          ]
          out = {
              "status": "pass",
              "tables": ordered,
              "matching_complex_entries": matching_complex,
              "matching_rationalized_entries": matching_rationalized,
              "truth_note": (
                  "Character-table compatibility only. Rationalization sums Galois "
                  "orbits of complex characters; Schur-index and integral-lattice "
                  "realization checks remain separate."
              ),
          }
          Path("certificates/l30_character_scan.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "status": out["status"],
              "complex_degree_30_count": sum(
                  len(t["degree_30_complex_characters"]) for t in ordered
              ),
              "rationalized_degree_30_count": sum(
                  sum(1 for c in t["rationalized_characters_degree_at_most_60"]
                      if c["degree"] == 30)
                  for t in ordered
              ),
              "fixed_rank_8_rationalized_match_count": len(matching_rationalized),
          }, sort_keys=True))
          PY
          python3 -m json.tool certificates/l30_character_scan.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: l30-character-scan
          path: |
            certificates/l30_character_scan.tsv
            certificates/l30_character_scan.json
          if-no-files-found: error
      - name: Preserve the exact character-table certificate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/l30_character_scan.tsv certificates/l30_character_scan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record the rationalized rank-30 character scan"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
