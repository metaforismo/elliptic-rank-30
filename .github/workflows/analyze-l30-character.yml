name: analyze-l30-character

on:
  push:
    paths:
      - "research/l30_character_scan.sage.py"
      - ".github/workflows/analyze-l30-character.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan degree-30 characters and order-three fixed spaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certificates
          sage -python research/l30_character_scan.sage.py \
            --output certificates/l30_character_scan.json
      - uses: actions/upload-artifact@v4
        with:
          name: l30-character-scan
          path: certificates/l30_character_scan.json
          if-no-files-found: error
      - name: Preserve the exact character-table certificate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/l30_character_scan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record the order-three rank-30 character scan"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
