name: verify-hessian-outer-galois-reduction

on:
  push:
    paths:
      - "research/hessian_outer_galois_certificate.py"
      - "certificates/hessian_outer_galois_reduction.json"
      - "tests/test_hessian_outer_galois_reduction.py"
      - ".github/workflows/verify-hessian-outer-galois-reduction.yml"
  pull_request:
    paths:
      - "research/hessian_outer_galois_certificate.py"
      - "certificates/hessian_outer_galois_reduction.json"
      - "tests/test_hessian_outer_galois_reduction.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install exact symbolic dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir sympy==1.14.0
      - name: Regenerate the exact certificate
        run: python3 research/hessian_outer_galois_certificate.py
      - name: Run focused theorem tests
        run: python3 -m unittest tests.test_hessian_outer_galois_reduction -v
      - name: Persist canonical generated JSON
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/hessian_outer_galois_reduction.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate the Hessian outer-Galois certificate"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
