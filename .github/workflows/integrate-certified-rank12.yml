name: integrate-certified-rank12

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-certified-rank12.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Generate and verify the exact packet certificate
        run: |
          set -euo pipefail
          python3 research/derive_three_trisection_split_quartic_tangent_point.py \
            --check certificates/small_split_e8_three_trisection_tangent_split_parameter.json
          python3 research/certify_tangent_split_rank12_exact.py \
            --split-certificate certificates/small_split_e8_three_trisection_tangent_split_parameter.json \
            --output certificates/small_split_e8_tangent_fibre_exact_rank12_packet.json
          python3 -m unittest discover -s tests -v
      - name: Update the approach registry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('APPROACH_REGISTRY.json')
          registry = json.loads(path.read_text())
          registry['updated_at'] = '2026-08-09'
          entry = {
            'approach_id': 'C3-split-e8-three-trisection-rank12',
            'mathematical_family': 'A split E8 rational elliptic surface equipped with three genus-zero trisection orbits sharing one degree-three cover of the base.',
            'central_mechanism': 'The eight split-E8 sections are combined with differences between three trisections on a common cubic cover; a tangent-derived completely split fibre yields four additional independent Mordell-Weil directions.',
            'assumptions': [],
            'predicted_advantage': 'It raises a controlled rank-8 geometric floor to an explicitly certified rank-12 subgroup and converts the next search into the finite problem of finding more compatible trisection orbits or covers.',
            'concrete_next_test': 'Tensorize all 1,920 genus-zero trisection orbits, compare their degree-three covers modulo several good primes up to PGL2 source equivalence, lift surviving collisions over Q, and incrementally certify new directions on rational split fibres.',
            'evidence_for': [
              'certificates/small_split_e8_tangent_fibre_exact_rank12_packet.json proves exact subgroup rank 12 by two exact trace relations and a direct plane-cubic finite-reduction certificate modulo 5.',
              'certificates/small_split_e8_tangent_fibre_rank12_sage.json independently reproduces rank 12 after a SageMath 10.9 plane-cubic-to-Weierstrass transformation.',
              'The direct plane-cubic reduction engine reproduces the earlier rank-10 control fibre before certifying the tangent-derived fibre.'
            ],
            'evidence_against': [
              'A first completely split fibre supplied only rank 10 or 11 because an additional exact packet relation appeared.',
              'Complete splitting of one common cubic cover does not automatically make every visible trisection difference independent.',
              'Even a generic rank-12 component remains eighteen directions short of the final target unless it can be combined with stronger geometry or several compatible packets.'
            ],
            'computational_cost': 'Medium for modular cover-equivalence scans; high for exact lifting, height calculations, and simultaneous split-fibre searches.',
            'missing_lemma': 'A scalable criterion predicting when several cover-equivalent trisection orbits contribute distinct anti-invariant Mordell-Weil directions after specialization.',
            'blocker': 'The remaining trisection-orbit catalogue has not yet been converted to compact cover tensors and audited across enough characteristics.',
            'status': 'PROVED_MODULE'
          }
          registry['approaches'] = [
              item for item in registry['approaches']
              if item.get('approach_id') != entry['approach_id']
          ] + [entry]
          path.write_text(json.dumps(registry, indent=2, sort_keys=True) + '\n')
          PY
      - name: Remove one-shot workflow and obsolete diagnostics
        run: |
          rm -f .github/workflows/integrate-certified-rank12.yml
          rm -f .github/workflows/probe-simple-e8-pencil.yml
          rm -f .github/workflows/probe-rank29-descent.yml
          rm -f .github/workflows/probe-cubic-packet-rank.yml
          rm -f .github/workflows/probe-line-trisection-branch-map.yml
          rm -f bootstrap/rank12.part.00 bootstrap/rank12.part.01
          git diff --check
      - name: Commit the canonical research state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'integration produced no changes' >&2; exit 1; }
          git commit -m "Integrate the certified split-E8 rank-12 packet"
          git push
