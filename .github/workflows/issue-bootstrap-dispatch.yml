name: issue-bootstrap-dispatch

on:
  issue_comment:
    types: [created]

permissions:
  actions: write

jobs:
  dispatch:
    if: github.event.issue.number == 1 && github.event.comment.body == '/bootstrap'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the corrected bootstrap workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bootstrap-import-corrected.yml --ref main
