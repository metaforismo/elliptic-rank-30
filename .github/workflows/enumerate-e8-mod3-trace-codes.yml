name: enumerate-e8-mod3-trace-codes

on:
  push:
    paths:
      - "search/enumerate_e8_mod3_trace_codes.py"
      - "tests/test_e8_mod3_trace_codes.py"
      - ".github/workflows/enumerate-e8-mod3-trace-codes.yml"
  pull_request:
    paths:
      - "search/enumerate_e8_mod3_trace_codes.py"
      - "tests/test_e8_mod3_trace_codes.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enumerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enumerate all maximal ternary trace codes
        shell: bash
        run: |
          set -euo pipefail
          python3 search/enumerate_e8_mod3_trace_codes.py \
            --output search/e8_mod3_maximal_trace_codes.json
      - name: Verify the complete enumeration
        run: python3 -m unittest tests.test_e8_mod3_trace_codes -v
      - name: Persist the canonical code list
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search/e8_mod3_maximal_trace_codes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enumerate all 2240 maximal ternary trace codes"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
