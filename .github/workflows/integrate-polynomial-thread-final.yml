name: integrate-polynomial-thread-final

on:
  push:
    paths:
      - ".github/workflows/integrate-polynomial-thread-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recompute every exact polynomial-thread certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 research/degree24_polynomial_section_obstruction.py \
            --check certificates/degree24_polynomial_section_obstruction.json
          python3 research/degree24_polynomial_section_classification.py \
            --check certificates/degree24_polynomial_section_classification.json
          python3 research/degree24_collision_descent.py \
            --check certificates/degree24_collision_descent.json
          python3 research/polynomial_section_mason_bound.py \
            --check certificates/polynomial_section_mason_bound.json
          python3 research/degree47_degenerate_obstruction.py \
            --check certificates/degree47_degenerate_obstruction.json
          python3 research/degree24_collision_search.py \
            --numerator-bound 256 \
            --denominator-bound 256 \
            --expect-collisions 0 \
            --output certificates/degree24_collision_search_n256_d256.json
          python3 research/degree47_belyi_passport.py \
            --output certificates/degree47_belyi_passport.json
          python3 -m unittest discover -s tests -v

      - name: Canonicalize the research checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')
          date = '2026-08-08'
          passport_path = root / 'certificates/degree47_belyi_passport.json'
          passport = json.loads(passport_path.read_text(encoding='utf-8'))
          dessins = int(passport['dessin_count'])
          labelled = int(passport['raw_passport_count'])
          transitive = int(passport['transitive_passport_count'])
          digest = passport['record_sha256']

          if dessins == 0:
              polynomial_state = 'CLOSED_FOR_TARGET'
              exact_conclusion = (
                  'The generic maximal passport is empty, while both degenerate target '
                  'remainders are independently impossible.  Together with Mason--Stothers '
                  'and the complete degree-(2,4) classification, every polynomial identity '
                  'of this shape is ruled out for the historical coefficient p=3.'
              )
              next_action = (
                  'Move the inverse-construction thread to controlled-pole rational functions '
                  'and keep the K3/high-generic-rank workstreams active.'
              )
          else:
              polynomial_state = 'FINITE_ARITHMETIC_RECONSTRUCTION_REQUIRED'
              exact_conclusion = (
                  f'There are {dessins} topological dessin class(es) in the generic maximal '
                  'passport.  Both repeated-root remainders are impossible; only arithmetic '
                  'reconstruction and field-of-definition tests for these finite classes remain.'
              )
              next_action = (
                  'Reconstruct every exact Belyi map, determine its field of definition, '
                  'normalize the unique order-two point above 1 to v=0, and test whether the '
                  'denominator is v^3-Sv^2+3v+1 over Q.'
              )

          result_report = f'''# Final polynomial-thread checkpoint

**Mathematical status:** rank-30 challenge remains unsolved; proved lower bound
remains 29.

## Exact results

1. The complete degree-(2,4) rational coefficient scheme is
   `p=t^12/186624-t^3/6`.
2. The historical coefficient `p=3` is not in that image.
3. Any collision in the forcing map satisfies simultaneous Gaussian and
   Eisenstein ninth-power norm equations.
4. Mason--Stothers proves that `(deg L,deg Q)=(4,7)` is the final possible
   polynomial level.
5. The repeated-root parameters `S=-3` and `S=15/4` are impossible at that
   level.
6. The complete nondegenerate passport enumeration found:
   - labelled passport triples: **{labelled}**
   - transitive labelled triples: **{transitive}**
   - dessin isomorphism classes: **{dessins}**
   - certificate digest: `{digest}`

## Exact conclusion

{exact_conclusion}

## Highest-value next action

{next_action}
'''
          (root / 'research/POLYNOMIAL_THREAD_CHECKPOINT.md').write_text(
              result_report, encoding='utf-8'
          )

          def append_section(filename: str, marker: str, section: str) -> None:
              path = root / filename
              text = path.read_text(encoding='utf-8') if path.exists() else f'# {path.stem}\n'
              if marker not in text:
                  path.write_text(text.rstrip() + '\n\n' + section.strip() + '\n', encoding='utf-8')

          append_section(
              'CLAIMS.md',
              'final-polynomial-thread-claims-2026-08-08',
              f'''<!-- final-polynomial-thread-claims-2026-08-08 -->
## Final polynomial-thread claim map

| Claim | Status | Evidence |
|---|---|---|
| Complete degree-(2,4) classification | proved | `certificates/degree24_polynomial_section_classification.json` |
| No degree-(2,4) target solution at `p=3` | proved | `certificates/degree24_polynomial_section_obstruction.json` |
| Collision ninth-power descent | proved necessary condition | `certificates/degree24_collision_descent.json` |
| No collision in reduced box `|n|,d<=256` | exact bounded computation | `certificates/degree24_collision_search_n256_d256.json` |
| No polynomial levels with `deg L>=6` | proved by Mason--Stothers | `certificates/polynomial_section_mason_bound.json` |
| Both repeated-root degree-(4,7) cases impossible | proved | `certificates/degree47_degenerate_obstruction.json` |
| Complete generic degree-(4,7) dessin enumeration | proved finite computation; `{dessins}` class(es) | `certificates/degree47_belyi_passport.json` |
| Rank at least 30 | unknown | not claimed |'''
          )

          append_section(
              'NEGATIVE_RESULTS.md',
              'final-polynomial-thread-negative-2026-08-08',
              f'''<!-- final-polynomial-thread-negative-2026-08-08 -->
## Polynomial-section ansatz checkpoint

The degree-(2,4) target is proved impossible.  Mason--Stothers rules out every
level beyond degree (4,7).  At degree (4,7), both repeated-root target cubics
are proved impossible and the nondegenerate passport has exactly `{dessins}`
topological dessin class(es).  State: `{polynomial_state}`.

This result does not cover rational functions with poles and does not imply a
Mordell--Weil rank upper bound.'''
          )

          append_section(
              'DECISIONS.md',
              'final-polynomial-thread-decision-2026-08-08',
              f'''<!-- final-polynomial-thread-decision-2026-08-08 -->
## Decision: polynomial inverse-construction thread

Canonical state: `{polynomial_state}`.

{exact_conclusion}

Do not enlarge blind polynomial coefficient searches.  Next action:
{next_action}'''
          )

          append_section(
              'STATUS.md',
              'final-polynomial-thread-status-2026-08-08',
              f'''<!-- final-polynomial-thread-status-2026-08-08 -->
## Final exact polynomial-thread checkpoint

- Proved lower bound: `rank E(Q) >= 29`.
- Rank-30 certificate: not found.
- Polynomial inverse-construction state: `{polynomial_state}`.
- Generic maximal dessin count: `{dessins}`.
- Exact conclusion: {exact_conclusion}
- Next action: {next_action}'''
          )

          checkpoint_path = root / 'CHECKPOINT.json'
          checkpoint = json.loads(checkpoint_path.read_text(encoding='utf-8')) if checkpoint_path.exists() else {}
          checkpoint['polynomial_inverse_construction'] = {
              'state': polynomial_state,
              'degree24_classification': 'certificates/degree24_polynomial_section_classification.json',
              'degree24_target_obstruction': 'certificates/degree24_polynomial_section_obstruction.json',
              'collision_descent': 'certificates/degree24_collision_descent.json',
              'collision_search': 'certificates/degree24_collision_search_n256_d256.json',
              'mason_bound': 'certificates/polynomial_section_mason_bound.json',
              'degenerate_obstruction': 'certificates/degree47_degenerate_obstruction.json',
              'generic_passport': 'certificates/degree47_belyi_passport.json',
              'generic_dessin_count': dessins,
              'next_action': next_action,
          }
          checkpoint['mathematical_status'] = {
              'best_unconditional_lower_bound': 29,
              'rank_30_found': False,
              'remaining_gap': 1,
          }
          checkpoint['updated'] = date
          checkpoint_path.write_text(json.dumps(checkpoint, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          frontier_path = root / 'STATUS.frontier.json'
          frontier = json.loads(frontier_path.read_text(encoding='utf-8'))
          frontier['authoritative_lower_bound'] = 29
          frontier['record_claim'] = False
          frontier['truth_status'] = 'UNSOLVED: exact rank lower bound 29; no rank-30 certificate'
          frontier['polynomial_inverse_construction'] = {
              'state': polynomial_state,
              'generic_dessin_count': dessins,
              'passport_sha256': digest,
              'exact_conclusion': exact_conclusion,
              'next_action': next_action,
          }
          frontier['updated'] = date
          frontier_path.write_text(json.dumps(frontier, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          registry_path = root / 'APPROACH_REGISTRY.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          if isinstance(registry, list):
              approaches = registry
          elif isinstance(registry, dict):
              approaches = registry.get('approaches')
              if not isinstance(approaches, list):
                  approaches = registry.get('registry')
              if not isinstance(approaches, list):
                  approaches = []
                  registry['approaches'] = approaches
          else:
              raise SystemExit('unsupported approach registry shape')

          for approach in approaches:
              if not isinstance(approach, dict):
                  continue
              searchable = ' '.join(str(value) for value in approach.values()).lower()
              if 'inverse' not in searchable and 'polynomial' not in searchable:
                  continue
              approach['status'] = polynomial_state
              approach['concrete_next_test'] = next_action
              approach['missing_lemma'] = (
                  'none in the polynomial thread' if dessins == 0 else
                  'exact arithmetic reconstruction and Q-field test for every maximal dessin'
              )
              approach['blocker'] = (
                  'polynomial representation exhausted; change representation' if dessins == 0 else
                  'topological enumeration complete; exact Belyi reconstruction pending'
              )
          registry_path.write_text(json.dumps(registry, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/integrate-degree24-research.yml
          rm -f .github/workflows/integrate-degree47-passport.yml
          rm -f .github/workflows/integrate-polynomial-thread-final.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Reproduce from the updated tree
        shell: bash
        run: |
          set -euo pipefail
          python3 research/degree24_polynomial_section_obstruction.py \
            --check certificates/degree24_polynomial_section_obstruction.json
          python3 research/degree24_polynomial_section_classification.py \
            --check certificates/degree24_polynomial_section_classification.json
          python3 research/degree24_collision_descent.py \
            --check certificates/degree24_collision_descent.json
          python3 research/polynomial_section_mason_bound.py \
            --check certificates/polynomial_section_mason_bound.json
          python3 research/degree47_degenerate_obstruction.py \
            --check certificates/degree47_degenerate_obstruction.json
          python3 research/degree47_belyi_passport.py \
            --check certificates/degree47_belyi_passport.json
          python3 research/degree24_collision_search.py \
            --numerator-bound 256 \
            --denominator-bound 256 \
            --expect-collisions 0 \
            --output /tmp/collision-recheck.json
          cmp certificates/degree24_collision_search_n256_d256.json /tmp/collision-recheck.json
          python3 -m unittest discover -s tests -v

      - name: Rebuild manifest, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f ! -path './.git/*' ! -name 'MANIFEST.sha256' \
            -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo "No integration changes" >&2; exit 1; }
          git commit -m "Integrate the exact polynomial inverse-construction checkpoint"
          git push
