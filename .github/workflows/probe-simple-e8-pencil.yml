name: probe-simple-e8-pencil

on:
  push:
    paths:
      - ".github/workflows/probe-simple-e8-pencil.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: sagemath/sagemath:10.9
    steps:
      - name: Compute exact cubic invariants and Jacobian
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/simple-e8-pencil
          cat > /tmp/probe_simple_e8.py <<'PY'
          from __future__ import annotations
          import json, traceback
          from pathlib import Path
          from sage.all import (
              EllipticCurve_from_cubic, FunctionField, PolynomialRing, QQ,
              gcd, invariant_theory, version,
          )

          OUT=Path('/tmp/simple-e8-pencil')
          result={'status':'started','sage_version':str(version())}
          try:
              R=PolynomialRing(QQ,names=('X','Y','Z')); X,Y,Z=R.gens()
              F=(1205*X**3-7107*X**2*Y+22560*X**2*Z+11736*X*Y**2
                 -30072*X*Y*Z-96845*X*Z**2-2764*Y**3+9864*Y**2*Z
                 +31855*Y*Z**2)
              G=(3755*X**3+3412*X**2*Y-89290*X**2*Z-25996*X*Y**2
                 +89032*X*Y*Z+230605*X*Z**2+5184*Y**3-31264*Y**2*Z
                 +235450*Z**3)
              points=[(1,7,1),(-7,-6,1),(5,1,1),(3,4,1),(-5,-5,1),
                      (-1,5,1),(-3,-4,1),(-2,-6,1),
                      (QQ(-2031)/1145,QQ(-4021)/1145,1)]
              if not all(F(*P)==0 and G(*P)==0 for P in points):
                  raise AssertionError('base point check failed')
              K=FunctionField(QQ,'t'); t=K.gen()
              Sring=PolynomialRing(K,names=('x','y','z')); x,y,z=Sring.gens()
              cubic=Sring(F(x,y,z))+t*Sring(G(x,y,z))
              form=invariant_theory.ternary_cubic(cubic,x,y,z)
              invS,invT=form.S_invariant(),form.T_invariant()
              E=EllipticCurve_from_cubic(cubic,[K(1),K(7),K(1)],morphism=False)
              delta=E.discriminant(); c4=E.c_invariants()[0]
              dp=delta.numerator().univariate_polynomial()
              dd=delta.denominator().univariate_polynomial()
              cp=c4.numerator().univariate_polynomial()
              minus=(4*invS)**3-invT**2
              plus=(4*invS)**3+invT**2
              def const_ratio(a,b):
                  if b==0:return None
                  q=a/b
                  return str(q) if q.derivative(t)==0 else None
              t0=QQ(8)/13
              specialized=(F+t0*G).factor()
              result.update({
                  'status':'ok',
                  'F':str(F),'G':str(G),
                  'S_invariant':str(invS),'T_invariant':str(invT),
                  'a_invariants':[str(a) for a in E.a_invariants()],
                  'c4':str(c4),'c6':str(E.c_invariants()[1]),
                  'discriminant':str(delta),'j_invariant':str(E.j_invariant()),
                  'delta_numerator':str(delta.numerator()),
                  'delta_denominator':str(delta.denominator()),
                  'delta_numerator_degree':int(dp.degree()),
                  'delta_denominator_degree':int(dd.degree()),
                  'delta_squarefree':bool(gcd(dp,dp.derivative()).degree()==0),
                  'gcd_delta_c4':str(gcd(dp,cp)),
                  'delta_factorization':str(dp.factor()),
                  'invariant_relation':{
                      'delta_over_minus':const_ratio(delta,minus),
                      'delta_over_plus':const_ratio(delta,plus),
                  },
                  'reducible_parameter':'8/13',
                  'factorization_at_8_over_13':str(specialized),
              })
          except Exception as exc:
              result.update({'status':'error','error':repr(exc),'traceback':traceback.format_exc()})
          (OUT/'result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          (OUT/'summary.txt').write_text('\n'.join([
              f"status={result.get('status')}",
              f"delta_degrees={result.get('delta_numerator_degree')}/{result.get('delta_denominator_degree')}",
              f"squarefree={result.get('delta_squarefree')}",
              f"factor_at_8_13={result.get('factorization_at_8_over_13')}",
              f"error={result.get('error')}",
          ])+'\n')
          print((OUT/'summary.txt').read_text())
          PY
          sage -python /tmp/probe_simple_e8.py
      - uses: actions/upload-artifact@v4
        with:
          name: simple-split-e8-pencil-probe
          path: /tmp/simple-e8-pencil
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
