name: Certify rank-17 IV surfaces over F17

on:
  push:
    branches:
      - research/certified-modular-elimination
    paths:
      - ".github/workflows/certify-rank17-iv-surfaces-f17-v1.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile the authoritative exhaustive enumerator
        run: |
          set -euo pipefail
          gcc -std=c17 -O3 -Wall -Wextra -Werror \
            research/rank17_iv_surface_locus_finite_field.c \
            -o /tmp/rank17-iv-surface-enumerator

      - name: Exhaust F17 twice and cross-check F5 independently
        run: |
          set -euo pipefail
          /tmp/rank17-iv-surface-enumerator 17 > /tmp/f17-a.json
          /tmp/rank17-iv-surface-enumerator 17 > /tmp/f17-b.json
          cmp /tmp/f17-a.json /tmp/f17-b.json
          /tmp/rank17-iv-surface-enumerator 5 > /tmp/f5.json
          python3 research/rank17_iv_surface_locus_certificate_v2.py \
            --production /tmp/f17-a.json \
            --small-prime /tmp/f5.json \
            --output /tmp/rank17_iv_surfaces_f17_v2.json
          python3 research/rank17_iv_surface_locus_certificate_v2.py \
            --production /tmp/f17-b.json \
            --small-prime /tmp/f5.json \
            --compare /tmp/rank17_iv_surfaces_f17_v2.json

      - name: Validate the exact boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path(
              "/tmp/rank17_iv_surfaces_f17_v2.json"
          ).read_text())
          assert data["prime"] == 17
          assert data["visited_parameter_tuples"] == 2 * 16 * 17**5
          assert data["candidate_count"] == len(data["candidates"])
          assert data["independent_small_prime_cross_check"][
              "accepted_tuple_sets_identical"
          ] is True
          assert "no characteristic-zero" in data["truth_status"]
          assert "rank-30" in data["truth_status"]
          print({
              "candidate_count": data["candidate_count"],
              "certificate_sha256": data["certificate_sha256"],
          })
          PY
          sha256sum /tmp/f17-a.json /tmp/f17-b.json /tmp/f5.json \
            /tmp/rank17_iv_surfaces_f17_v2.json

      - uses: actions/upload-artifact@v4
        with:
          name: rank17-iv-surfaces-f17-v1
          path: |
            /tmp/f17-a.json
            /tmp/f17-b.json
            /tmp/f5.json
            /tmp/rank17_iv_surfaces_f17_v2.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Rebase-safe publication
        run: |
          set -euo pipefail
          branch='research/certified-modular-elimination'
          cp /tmp/rank17_iv_surfaces_f17_v2.json /tmp/publish-f17.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$branch"
          git reset --hard "origin/$branch"
          mkdir -p research/data
          cp /tmp/publish-f17.json \
            research/data/rank17_iv_surfaces_f17_v2.json
          git add research/data/rank17_iv_surfaces_f17_v2.json
          if git diff --cached --quiet; then
            echo "F17 certificate already present"
            exit 0
          fi
          git commit -m "Certify the normalized split IV surface locus over F17"
          git push origin "HEAD:$branch"
