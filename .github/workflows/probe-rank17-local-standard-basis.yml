name: probe-rank17-local-standard-basis

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-rank17-local-standard-basis.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
      - name: Compute an exact local standard basis over F7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rank17-local-standard-basis
          cat > /tmp/rank17_local_standard_basis.py <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          import time
          import traceback
          from pathlib import Path

          from sage.all import GF, PolynomialRing, version
          from sage.libs.singular.function_factory import singular_function

          OUT = Path('/tmp/rank17-local-standard-basis')
          result = {
              'status': 'started',
              'truth_status': 'exact local standard-basis computation over F_7; no characteristic-zero claim',
              'sage_version': str(version()),
              'singular_order': 'ds / negative degree reverse lexicographic',
          }

          try:
              spec = importlib.util.spec_from_file_location(
                  'local_branch',
                  'research/rank17_section_local_branch_f7.py',
              )
              module = importlib.util.module_from_spec(spec)
              assert spec.loader is not None
              spec.loader.exec_module(module)

              names = [f'd_{name}' for name in module.VARIABLES]
              ring = PolynomialRing(GF(7), names=names, order='negdegrevlex')
              deltas = list(ring.gens())
              shifted = [GF(7)(value) + delta for value, delta in zip(module.SEED, deltas, strict=True)]
              equations = [ring(polynomial) for polynomial in module.equations(shifted)]
              if len(equations) != 19 or any(polynomial(*([GF(7)(0)] * 17)) != 0 for polynomial in equations):
                  raise AssertionError('shifted incidence ideal is malformed')

              ideal = ring.ideal(equations)
              started = time.time()
              std = singular_function('std')
              dim_function = singular_function('dim')
              vdim_function = singular_function('vdim')
              basis = std(ideal)
              elapsed = time.time() - started
              dimension = int(dim_function(basis))
              vector_space_dimension = int(vdim_function(basis)) if dimension == 0 else None

              basis_polynomials = [ring(polynomial) for polynomial in basis]
              leading_monomials = [str(polynomial.lm()) for polynomial in basis_polynomials]
              basis_text = '\n'.join(str(polynomial) for polynomial in basis_polynomials) + '\n'
              (OUT / 'local-standard-basis.txt').write_text(basis_text)

              result.update({
                  'status': 'completed',
                  'variable_names': names,
                  'seed': module.SEED,
                  'equation_count': len(equations),
                  'equation_degrees': [int(polynomial.degree()) for polynomial in equations],
                  'standard_basis_count': len(basis_polynomials),
                  'local_krull_dimension': dimension,
                  'local_vector_space_dimension': vector_space_dimension,
                  'leading_monomials': leading_monomials,
                  'basis_sha256': hashlib.sha256(basis_text.encode()).hexdigest(),
                  'elapsed_seconds': elapsed,
              })
              if dimension == 0:
                  result['mathematical_consequence'] = (
                      'The incidence scheme is supported only at the closed point in the local ring. '
                      'The nonzero tangent direction is nilpotent and does not define a reduced local branch.'
                  )
              else:
                  result['mathematical_consequence'] = (
                      'The local incidence scheme has positive dimension; further radical/normalization analysis is required.'
                  )
          except Exception as exc:
              result.update({
                  'status': 'error',
                  'error': repr(exc),
                  'traceback': traceback.format_exc(),
              })

          raw = json.dumps(result, sort_keys=True, separators=(',', ':')).encode()
          result['record_sha256'] = hashlib.sha256(raw).hexdigest()
          (OUT / 'result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              key: result.get(key)
              for key in (
                  'status', 'local_krull_dimension', 'local_vector_space_dimension',
                  'standard_basis_count', 'elapsed_seconds', 'record_sha256', 'error'
              )
          }, indent=2, sort_keys=True), flush=True)
          if result['status'] == 'error':
              raise SystemExit(1)
          PY
          sage -python /tmp/rank17_local_standard_basis.py \
            | tee /tmp/rank17-local-standard-basis/run.log
          find /tmp/rank17-local-standard-basis -type f ! -name SHA256SUMS \
            -print0 | sort -z | xargs -0 sha256sum \
            > /tmp/rank17-local-standard-basis/SHA256SUMS
          cd /tmp/rank17-local-standard-basis
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank17-local-standard-basis
          path: /tmp/rank17-local-standard-basis
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
