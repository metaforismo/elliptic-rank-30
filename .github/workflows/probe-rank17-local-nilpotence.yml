name: probe-rank17-local-nilpotence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-rank17-local-nilpotence.yml"
      - "research/rank17_local_three_variable_elimination.py"
      - "research/rank17_local_nilpotence_f7.py"
      - "research/rank17_section_local_branch_f7.py"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recompute the three-variable elimination and nilpotence certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 research/rank17_local_three_variable_elimination.py \
            --degree 13 \
            --output /tmp/rank17-local-three-variable-elimination.json
          python3 research/rank17_local_nilpotence_f7.py \
            --output certificates/rank17_local_nilpotence_f7.json
          python3 research/rank17_local_nilpotence_f7.py \
            --compare certificates/rank17_local_nilpotence_f7.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          certificate = json.loads(
              Path("certificates/rank17_local_nilpotence_f7.json").read_text()
          )
          consequence = certificate["mathematical_consequence"]
          assert consequence["initial_ideal_contains"] == [
              "b^3", "w^4", "t^12"
          ]
          assert consequence["local_krull_dimension"] == 0
          assert consequence["local_length_upper_bound"] == 144
          assert consequence["reduced_local_branch_through_seed"] is False
          print("verified local F7 nilpotence certificate")
          PY

      - name: Preserve a clean exact test boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 verify_exact.py
          python3 -m unittest discover -s tests -v
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit only the canonical certificate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/rank17_local_nilpotence_f7.json
          git diff --cached --quiet && { echo "certificate delta missing" >&2; exit 1; }
          git commit -m "Certify local nilpotence at the rank-17 F7 incidence point"
          git push
