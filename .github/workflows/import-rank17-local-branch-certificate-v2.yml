name: import-rank17-local-branch-certificate-v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-rank17-local-branch-certificate-v2.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover the already-audited payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import textwrap
          import zlib
          from pathlib import Path

          source = Path('.github/workflows/import-rank17-local-branch-certificate.yml').read_text()
          start = source.index('          script_payload = (')
          end = source.index('          script = zlib.decompress', start)
          assignments = textwrap.dedent(source[start:end])
          namespace = {}
          exec(assignments, {}, namespace)
          script = zlib.decompress(base64.b85decode(namespace['script_payload'].encode()))
          certificate = zlib.decompress(base64.b85decode(namespace['certificate_payload'].encode()))
          Path('research/rank17_section_local_branch_f7.py').write_bytes(script)
          Path('certificates/rank17_section_local_branch_f7.json').write_bytes(certificate)
          PY

      - name: Recompute and test the proof object
        run: |
          set -euo pipefail
          python3 research/rank17_section_local_branch_f7.py \
            --compare certificates/rank17_section_local_branch_f7.json
          python3 verify_exact.py
          python3 -m unittest discover -s tests -v

      - name: Commit only the mathematical artifacts
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/rank17_section_local_branch_f7.py \
                  certificates/rank17_section_local_branch_f7.json
          git diff --cached --stat
          git diff --cached --quiet && { echo "no artifact delta" >&2; exit 1; }
          git commit -m "Certify the local F7 rank-17 section-incidence point"
          git push
