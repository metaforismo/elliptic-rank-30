name: canonical-cleanup-import

on:
  push:
    paths:
      - ".github/workflows/canonical-cleanup-import.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-cleanup-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct the canonical package and remove migration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "$GITHUB_REF_NAME"
          cat > /tmp/reconstruct_bootstrap.py <<'PY'
          from __future__ import annotations

          import base64
          import io
          import itertools
          import json
          import shutil
          import tarfile
          import tempfile
          import zipfile
          from pathlib import Path

          REQUIRED = {
              "curve.json",
              "points.json",
              "verify_exact.py",
              "verify_sage.py",
              "verify_magma.m",
          }
          BOOTSTRAP = Path("bootstrap")

          def read(name: str) -> bytes:
              return b"".join((BOOTSTRAP / name).read_bytes().split())

          def concat(*names: str) -> tuple[str, bytes]:
              return "+".join(names), b"".join(read(name) for name in names)

          def unique(rows):
              result = []
              seen = set()
              for label, data in rows:
                  if data in seen:
                      continue
                  seen.add(data)
                  result.append((label, data))
              return result

          if not BOOTSTRAP.exists():
              raise SystemExit("bootstrap directory is absent")

          # The migration history records seven complete 20k base64 blocks and
          # one final 7468-character block.  Parts 2 and 4 have alternate
          # continuations; test the small exact ambiguity set instead of an
          # exponential subset search.
          part0 = [concat("payload.part.000")]
          part1 = [concat("payload.part.001")]
          part2 = unique([
              concat("payload.part.002", "payload.part.002.tail"),
              concat("payload.part.002", "payload.part.002.01"),
              concat("payload.part.002", "payload.part.002.01", "payload.part.002.tail"),
              concat("payload.part.002"),
          ])
          part3 = [concat("payload.part.003")]
          part4 = unique([
              concat("payload.part.004"),
              concat("payload.part.004.00"),
              concat("payload.part.004", "payload.part.004.01.00"),
              concat("payload.part.004.00", "payload.part.004.01.00"),
          ])
          part5 = [concat("payload.part.005")]
          part6 = [concat(
              "payload.part.006.00",
              "payload.part.006.01",
              "payload.part.006.02",
              "payload.part.006.03",
              "payload.part.006.04.00",
              "payload.part.006.04.01",
              "payload.part.006.04.02",
              "payload.part.006.04.03",
          )]
          part7 = [concat(
              "payload.part.007.00.00",
              "payload.part.007.00.01",
              "payload.part.007.00.02",
              "payload.part.007.00.03",
              "payload.part.007.01.00",
              "payload.part.007.01.01",
              "payload.part.007.01.02",
              "payload.part.007.01.03",
          )]
          groups = [part0, part1, part2, part3, part4, part5, part6, part7]

          def decoded_variants(data: bytes):
              for pad in range(4):
                  try:
                      decoded = base64.b64decode(data + b"=" * pad, validate=True)
                  except Exception:
                      continue
                  if decoded.startswith(b"\xfd7zXZ\x00"):
                      yield "base64-xz", decoded

          def extract(data: bytes, destination: Path):
              stream = io.BytesIO(data)
              if zipfile.is_zipfile(stream):
                  stream.seek(0)
                  with zipfile.ZipFile(stream) as archive:
                      archive.extractall(destination)
                  return "zip"
              stream.seek(0)
              try:
                  with tarfile.open(fileobj=stream, mode="r:*") as archive:
                      archive.extractall(destination)
                  return "tar"
              except Exception:
                  return None

          def locate(destination: Path):
              directories = [destination] + [
                  path for path in destination.rglob("*") if path.is_dir()
              ]
              for directory in directories:
                  names = {path.name for path in directory.iterdir()}
                  if REQUIRED <= names:
                      return directory
              return None

          combinations = list(itertools.product(*groups))
          print(json.dumps({
              "candidate_counts": [len(group) for group in groups],
              "combination_count": len(combinations),
          }, sort_keys=True))

          diagnostics = []
          for attempt, combination in enumerate(combinations, 1):
              encoded = b"".join(item[1] for item in combination)
              row = {
                  "attempt": attempt,
                  "encoded_length": len(encoded),
                  "parts": [item[0] for item in combination],
              }
              for encoding, data in decoded_variants(encoded):
                  row["decoded_length"] = len(data)
                  with tempfile.TemporaryDirectory() as temporary:
                      destination = Path(temporary)
                      archive_kind = extract(data, destination)
                      row["archive"] = archive_kind
                      if not archive_kind:
                          continue
                      root = locate(destination)
                      if root is None:
                          row["required_root"] = False
                          continue
                      row["required_root"] = True
                      target = Path("/tmp/canonical-rank30")
                      if target.exists():
                          shutil.rmtree(target)
                      shutil.copytree(root, target)
                      plan = {
                          "status": "pass",
                          "attempt": attempt,
                          "encoding": encoding,
                          "archive": archive_kind,
                          "parts": row["parts"],
                          "encoded_length": len(encoded),
                          "decoded_length": len(data),
                          "file_count": sum(1 for path in root.rglob("*") if path.is_file()),
                      }
                      Path("/tmp/reconstruction-plan.json").write_text(
                          json.dumps(plan, indent=2, sort_keys=True) + "\n"
                      )
                      print(json.dumps(plan, sort_keys=True))
                      raise SystemExit(0)
              diagnostics.append(row)

          print(json.dumps({"diagnostics": diagnostics}, indent=2, sort_keys=True))
          raise SystemExit("could not reconstruct the canonical package")
          PY

          python3 /tmp/reconstruct_bootstrap.py
          for required in curve.json points.json verify_exact.py verify_sage.py verify_magma.m; do
            test -f "/tmp/canonical-rank30/$required"
          done

          rsync -a --ignore-existing --exclude '.git/' /tmp/canonical-rank30/ ./
          mkdir -p evidence
          cp /tmp/reconstruction-plan.json evidence/bootstrap-reconstruction-plan.json

          python3 verify_exact.py

          rm -rf bootstrap
          rm -f \
            .github/workflows/bootstrap-import.yml \
            .github/workflows/bootstrap-import-corrected.yml \
            .github/workflows/bootstrap-import-final.yml \
            .github/workflows/bootstrap-import-final-v2.yml \
            .github/workflows/import-canonical-now.yml \
            .github/workflows/history-cleanup.yml \
            .github/workflows/issue-bootstrap-dispatch.yml \
            .github/workflows/canonical-cleanup-import.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore the canonical certificate package and remove import scaffolding"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
