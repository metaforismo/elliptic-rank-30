name: canonical-cleanup-import

on:
  push:
    paths:
      - ".github/workflows/canonical-cleanup-import.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-cleanup-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct the canonical package and remove migration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "$GITHUB_REF_NAME"
          cat > /tmp/reconstruct_bootstrap.py <<'PY'
          from __future__ import annotations

          import base64
          import io
          import itertools
          import json
          import re
          import shutil
          import tarfile
          import tempfile
          import zipfile
          from pathlib import Path

          REQUIRED = {
              "curve.json",
              "points.json",
              "verify_exact.py",
              "verify_sage.py",
              "verify_magma.m",
          }

          def natural_key(path: Path):
              return [
                  int(piece) if piece.isdigit() else piece
                  for piece in re.split(r"(\d+)", path.name)
              ]

          def part_candidates(root: Path, index: int):
              stem = f"payload.part.{index:03d}"
              files = sorted(
                  [
                      path
                      for path in root.iterdir()
                      if path.is_file()
                      and (path.name == stem or path.name.startswith(stem + "."))
                  ],
                  key=lambda path: (0 if path.name == stem else 1, natural_key(path)),
              )
              if not files:
                  return []

              unique = []
              seen = set()
              for path in files:
                  data = b"".join(path.read_bytes().split())
                  if data in seen:
                      continue
                  seen.add(data)
                  unique.append((path.name, data))

              candidates = []
              candidate_data = set()
              # The migration fragments contain a mixture of complete chunks,
              # duplicate subdivisions, and tails.  Enumerate every ordered
              # subsequence so combinations such as `part.002 + part.002.tail`
              # are tested explicitly.
              for mask in range(1, 1 << len(unique)):
                  chosen = [unique[pos] for pos in range(len(unique)) if mask & (1 << pos)]
                  data = b"".join(item[1] for item in chosen)
                  if data in candidate_data:
                      continue
                  candidate_data.add(data)
                  candidates.append(("+".join(item[0] for item in chosen), data))

              # Try shorter and filename-simpler candidates first.
              candidates.sort(key=lambda row: (len(row[1]), row[0].count("+"), row[0]))
              return candidates

          def decoded_variants(data: bytes):
              compact = b"".join(data.split())
              for pad in range(4):
                  try:
                      decoded = base64.b64decode(compact + b"=" * pad, validate=True)
                  except Exception:
                      continue
                  if decoded.startswith(b"\xfd7zXZ\x00"):
                      yield "base64-xz", decoded
              if data.startswith((b"PK\x03\x04", b"\xfd7zXZ\x00")):
                  yield "raw", data

          def extract(data: bytes, destination: Path):
              stream = io.BytesIO(data)
              if zipfile.is_zipfile(stream):
                  stream.seek(0)
                  with zipfile.ZipFile(stream) as archive:
                      archive.extractall(destination)
                  return "zip"
              stream.seek(0)
              try:
                  with tarfile.open(fileobj=stream, mode="r:*") as archive:
                      archive.extractall(destination)
                  return "tar"
              except Exception:
                  return None

          def locate(destination: Path):
              directories = [destination] + [
                  path for path in destination.rglob("*") if path.is_dir()
              ]
              for directory in directories:
                  names = {path.name for path in directory.iterdir()}
                  if REQUIRED <= names:
                      return directory
              return None

          bootstrap = Path("bootstrap")
          if not bootstrap.exists():
              raise SystemExit("bootstrap directory is absent; refusing an ambiguous import")

          groups = []
          for index in range(100):
              candidates = part_candidates(bootstrap, index)
              if not candidates:
                  if groups:
                      break
                  continue
              groups.append(candidates)

          if not groups:
              raise SystemExit("no bootstrap payload fragments were found")

          combinations = 1
          for group in groups:
              combinations *= len(group)
          print(
              json.dumps(
                  {
                      "part_groups": len(groups),
                      "candidate_counts": [len(group) for group in groups],
                      "combination_count": combinations,
                  },
                  sort_keys=True,
              )
          )

          for attempt, combination in enumerate(itertools.product(*groups), 1):
              raw = b"".join(item[1] for item in combination)
              for encoding, data in decoded_variants(raw):
                  with tempfile.TemporaryDirectory() as temporary:
                      destination = Path(temporary)
                      archive_kind = extract(data, destination)
                      if not archive_kind:
                          continue
                      root = locate(destination)
                      if root is None:
                          continue
                      target = Path("/tmp/canonical-rank30")
                      if target.exists():
                          shutil.rmtree(target)
                      shutil.copytree(root, target)
                      plan = {
                          "status": "pass",
                          "attempt": attempt,
                          "encoding": encoding,
                          "archive": archive_kind,
                          "parts": [item[0] for item in combination],
                          "file_count": sum(1 for path in root.rglob("*") if path.is_file()),
                      }
                      Path("/tmp/reconstruction-plan.json").write_text(
                          json.dumps(plan, indent=2, sort_keys=True) + "\n"
                      )
                      print(json.dumps(plan, sort_keys=True))
                      raise SystemExit(0)

          raise SystemExit(
              f"could not reconstruct a valid canonical package after {combinations} combinations"
          )
          PY

          python3 /tmp/reconstruct_bootstrap.py
          for required in curve.json points.json verify_exact.py verify_sage.py verify_magma.m; do
            test -f "/tmp/canonical-rank30/$required"
          done

          rsync -a --ignore-existing --exclude '.git/' /tmp/canonical-rank30/ ./
          mkdir -p evidence
          cp /tmp/reconstruction-plan.json evidence/bootstrap-reconstruction-plan.json

          python3 verify_exact.py

          rm -rf bootstrap
          rm -f \
            .github/workflows/bootstrap-import.yml \
            .github/workflows/bootstrap-import-corrected.yml \
            .github/workflows/bootstrap-import-final.yml \
            .github/workflows/bootstrap-import-final-v2.yml \
            .github/workflows/import-canonical-now.yml \
            .github/workflows/history-cleanup.yml \
            .github/workflows/issue-bootstrap-dispatch.yml \
            .github/workflows/canonical-cleanup-import.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore the canonical certificate package and remove import scaffolding"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
