name: canonical-cleanup-import

on:
  push:
    paths:
      - ".github/workflows/canonical-cleanup-import.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-cleanup-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct the canonical package and remove migration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "$GITHUB_REF_NAME"
          cat > /tmp/reconstruct_bootstrap.py <<'PY'
          from __future__ import annotations
          import base64, io, itertools, json, re, shutil, tarfile, tempfile, zipfile
          from pathlib import Path

          REQUIRED={'curve.json','points.json','verify_exact.py','verify_sage.py','verify_magma.m'}

          def natural_key(path):
              return [int(x) if x.isdigit() else x for x in re.split(r'(\d+)',path.name)]

          def candidates(root,index):
              stem=f'payload.part.{index:03d}'
              direct=root/stem
              descendants=sorted(
                  [p for p in root.iterdir() if p.is_file() and p.name.startswith(stem+'.')],
                  key=natural_key,
              )
              leaves=[p for p in descendants if not any(q.name.startswith(p.name+'.') for q in descendants)]
              rows=[]
              if direct.exists(): rows.append((direct.name,direct.read_bytes()))
              if leaves:
                  leaf_data=b''.join(p.read_bytes() for p in leaves)
                  rows.append(('+'.join(p.name for p in leaves),leaf_data))
                  if direct.exists(): rows.append((direct.name+'+'+'+'.join(p.name for p in leaves),direct.read_bytes()+leaf_data))
              groups={}
              for p in descendants:
                  suffix=p.name[len(stem)+1:]
                  groups.setdefault(suffix.split('.')[0],[]).append(p)
              chunks=[]; labels=[]
              for top in sorted(groups,key=lambda s:int(s) if s.isdigit() else 10**9):
                  child=root/(stem+'.'+top)
                  group=groups[top]
                  child_desc=[p for p in group if p!=child]
                  child_leaves=[p for p in child_desc if not any(q.name.startswith(p.name+'.') for q in child_desc)]
                  if child.exists(): chunks.append(child.read_bytes()); labels.append(child.name)
                  elif child_leaves:
                      child_leaves=sorted(child_leaves,key=natural_key)
                      chunks.append(b''.join(p.read_bytes() for p in child_leaves))
                      labels.append('+'.join(p.name for p in child_leaves))
              if chunks:
                  data=b''.join(chunks)
                  rows.append(('+'.join(labels),data))
                  if direct.exists(): rows.append((direct.name+'+'+'+'.join(labels),direct.read_bytes()+data))
              out=[]; seen=set()
              for label,data in rows:
                  if data not in seen: seen.add(data); out.append((label,data))
              return out

          def variants(data):
              yield 'raw',data
              compact=b''.join(data.split())
              for pad in range(4):
                  try: yield 'base64',base64.b64decode(compact+b'='*pad,validate=False)
                  except Exception: pass

          def extract(data,dest):
              if zipfile.is_zipfile(io.BytesIO(data)):
                  with zipfile.ZipFile(io.BytesIO(data)) as z: z.extractall(dest)
                  return 'zip'
              try:
                  with tarfile.open(fileobj=io.BytesIO(data),mode='r:*') as t: t.extractall(dest)
                  return 'tar'
              except Exception: return None

          def locate(dest):
              for p in [dest]+[x for x in dest.rglob('*') if x.is_dir()]:
                  if REQUIRED <= {x.name for x in p.iterdir()}: return p
              return None

          bootstrap=Path('bootstrap')
          if not bootstrap.exists():
              raise SystemExit('bootstrap directory is absent; refusing an ambiguous import')
          groups=[]
          for index in range(100):
              rows=candidates(bootstrap,index)
              if not rows:
                  if groups: break
                  continue
              groups.append(rows)
          for attempt,combo in enumerate(itertools.product(*groups),1):
              raw=b''.join(item[1] for item in combo)
              for encoding,data in variants(raw):
                  with tempfile.TemporaryDirectory() as td:
                      dest=Path(td)
                      archive=extract(data,dest)
                      if not archive: continue
                      root=locate(dest)
                      if not root: continue
                      target=Path('/tmp/canonical-rank30')
                      if target.exists(): shutil.rmtree(target)
                      shutil.copytree(root,target)
                      plan={
                          'status':'pass','attempts':attempt,'encoding':encoding,
                          'archive':archive,'parts':[x[0] for x in combo],
                          'file_count':sum(1 for p in root.rglob('*') if p.is_file()),
                      }
                      Path('/tmp/reconstruction-plan.json').write_text(json.dumps(plan,indent=2)+'\n')
                      print(json.dumps(plan,sort_keys=True))
                      raise SystemExit(0)
          raise SystemExit('could not reconstruct a valid canonical package')
          PY
          python3 /tmp/reconstruct_bootstrap.py
          for required in curve.json points.json verify_exact.py verify_sage.py verify_magma.m; do
            test -f "/tmp/canonical-rank30/$required"
          done
          rsync -a --ignore-existing --exclude '.git/' /tmp/canonical-rank30/ ./
          cp /tmp/reconstruction-plan.json evidence/bootstrap-reconstruction-plan.json

          rm -rf bootstrap
          rm -f \
            .github/workflows/bootstrap-import.yml \
            .github/workflows/bootstrap-import-corrected.yml \
            .github/workflows/bootstrap-import-final.yml \
            .github/workflows/bootstrap-import-final-v2.yml \
            .github/workflows/import-canonical-now.yml \
            .github/workflows/history-cleanup.yml \
            .github/workflows/issue-bootstrap-dispatch.yml \
            .github/workflows/canonical-cleanup-import.yml

          python3 verify_exact.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore the canonical certificate package and remove import scaffolding"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
