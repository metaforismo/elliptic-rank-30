name: integrate-polynomial-thread-v2

on:
  push:
    paths:
      - ".github/workflows/integrate-polynomial-thread-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polynomial-thread-final
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recompute standard-library proof certificates
        shell: bash
        run: |
          set -euo pipefail
          python3 research/degree24_polynomial_section_obstruction.py \
            --check certificates/degree24_polynomial_section_obstruction.json
          python3 research/degree24_polynomial_section_classification.py \
            --check certificates/degree24_polynomial_section_classification.json
          python3 research/degree24_collision_descent.py \
            --check certificates/degree24_collision_descent.json
          python3 research/polynomial_section_mason_bound.py \
            --check certificates/polynomial_section_mason_bound.json
          python3 research/degree47_degenerate_obstruction.py \
            --check certificates/degree47_degenerate_obstruction.json
          python3 research/degree47_target_mod19_obstruction.py \
            --check certificates/degree47_target_mod19_obstruction.json

      - name: Run exact finite searches and combinatorial enumeration
        shell: bash
        run: |
          set -euo pipefail
          python3 research/degree24_collision_search.py \
            --numerator-bound 256 \
            --denominator-bound 256 \
            --expect-collisions 0 \
            --output certificates/degree24_collision_search_n256_d256.json
          python3 research/degree47_belyi_passport.py \
            --output certificates/degree47_belyi_passport.json
          python3 research/degree47_belyi_passport.py \
            --check certificates/degree47_belyi_passport.json

      - name: Run pinned independent Groebner cross-check
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p logs certificates
          python3 -m pip install --disable-pip-version-check 'sympy==1.13.3' \
            > logs/degree47_sympy_install.log 2>&1
          install_rc=$?
          if [ "$install_rc" -eq 0 ]; then
            python3 research/degree47_target_elimination.py \
              --output /tmp/degree47_target_elimination.json \
              > logs/degree47_target_elimination.log 2>&1
            run_rc=$?
          else
            run_rc=127
            printf 'SymPy installation failed; elimination was not run.\n' \
              > logs/degree47_target_elimination.log
          fi
          INSTALL_RC="$install_rc" RUN_RC="$run_rc" python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          install_log = Path('logs/degree47_sympy_install.log')
          run_log = Path('logs/degree47_target_elimination.log')
          output = Path('/tmp/degree47_target_elimination.json')
          install_rc = int(os.environ['INSTALL_RC'])
          run_rc = int(os.environ['RUN_RC'])
          record = {
              'certificate_id': 'degree47-groebner-crosscheck-v1',
              'claim_status': 'independent exact cross-check',
              'install_exit_code': install_rc,
              'run_exit_code': run_rc,
              'schema_version': 1,
              'sympy_version_requested': '1.13.3',
              'logs': {
                  'install_sha256': hashlib.sha256(install_log.read_bytes()).hexdigest(),
                  'run_sha256': hashlib.sha256(run_log.read_bytes()).hexdigest(),
              },
          }
          if install_rc == 0 and run_rc == 0 and output.exists():
              data = json.loads(output.read_text(encoding='utf-8'))
              record.update({
                  'status': 'passed',
                  'result': data.get('result'),
                  'full_rational_solution_count': len(data.get('full_rational_solutions', [])),
                  'elimination_record_sha256': data.get('record_sha256'),
                  'sympy_version_observed': data.get('software', {}).get('sympy_version'),
              })
              Path('certificates/degree47_target_elimination.json').write_text(
                  json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8'
              )
          else:
              record.update({
                  'status': 'failed_optional_crosscheck',
                  'result': 'not_available',
                  'full_rational_solution_count': None,
                  'scope_limitation': 'The pure standard-library mod-19 proof remains the proof-critical certificate.',
              })
          Path('certificates/degree47_groebner_crosscheck.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          exit 0

      - name: Run the complete test suite
        shell: bash
        run: |
          set -euo pipefail
          python3 verify_exact.py
          python3 -m unittest discover -s tests -v

      - name: Update canonical research state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')
          date = '2026-08-08'
          passport = json.loads(
              (root / 'certificates/degree47_belyi_passport.json').read_text(encoding='utf-8')
          )
          collision = json.loads(
              (root / 'certificates/degree24_collision_search_n256_d256.json').read_text(encoding='utf-8')
          )
          crosscheck = json.loads(
              (root / 'certificates/degree47_groebner_crosscheck.json').read_text(encoding='utf-8')
          )
          dessins = int(passport['dessin_count'])
          labelled = int(passport['raw_passport_count'])
          transitive = int(passport['transitive_passport_count'])
          polynomial_state = 'CLOSED_FOR_POLYNOMIAL_IDENTITIES_AT_P_EQUALS_3'
          conclusion = (
              'The complete degree-(2,4) classification excludes p=3; '
              'Mason--Stothers proves that degree (4,7) is the last possible '
              'polynomial level; the two repeated-root branches are impossible; '
              'and an independent mod-19 determinant obstruction excludes the '
              'generic degree-(4,7) branch.  Therefore every polynomial identity '
              'of this specific shape at p=3 is impossible.'
          )
          next_action = (
              'Change representation to controlled-pole rational functions and '
              'continue independently with the explicit rank-17 K3 bridge, '
              'alternative high-generic-rank families, and the Gaussian/Eisenstein '
              'ninth-power collision locus for other coefficients.'
          )

          report = f'''# Polynomial inverse-construction checkpoint

**Global challenge status:** UNSOLVED.  The unconditional record baseline remains
`rank E(Q) >= 29`; no rank-30 certificate has been found.

## Proved results in this thread

1. Complete degree-(2,4) coefficient classification:
   `p=t^12/186624-t^3/6`.
2. The historical coefficient `p=3` is outside that rational image.
3. Any collision in the forcing map satisfies simultaneous Gaussian and
   Eisenstein ninth-power norm equations.
4. Mason--Stothers proves that `(deg L,deg Q)=(4,7)` is the final possible
   polynomial level.
5. The repeated-root parameters `S=-3` and `S=15/4` are impossible at that
   level.
6. The generic degree-(4,7) target is impossible by the primitive determinant
   quintic with no root modulo 19.

Hence the state is `{polynomial_state}`.

## Independent computations

- bounded collision domain: `{collision['domain']}`
- parameters tested: `{collision['parameter_count']}`
- collisions found: `{collision['collision_count']}`
- labelled maximal-passport triples: `{labelled}`
- transitive labelled triples: `{transitive}`
- dessin isomorphism classes: `{dessins}`
- optional pinned Gröbner cross-check: `{crosscheck['status']}`

## Scope

{conclusion}

This does not cover rational functions with finite poles, different norm forms,
or arbitrary elliptic surfaces, and it is not a universal rank bound.

## Highest-value next action

{next_action}
'''
          (root / 'research/POLYNOMIAL_THREAD_CHECKPOINT.md').write_text(
              report, encoding='utf-8'
          )

          def append_section(filename: str, marker: str, section: str) -> None:
              path = root / filename
              text = path.read_text(encoding='utf-8') if path.exists() else f'# {path.stem}\n'
              if marker not in text:
                  path.write_text(text.rstrip() + '\n\n' + section.strip() + '\n', encoding='utf-8')

          append_section(
              'CLAIMS.md',
              'polynomial-thread-final-v2-claims',
              f'''<!-- polynomial-thread-final-v2-claims -->
## Polynomial inverse-construction claim map

| Claim | Status | Evidence |
|---|---|---|
| Complete degree-(2,4) classification | proved | `certificates/degree24_polynomial_section_classification.json` |
| No degree-(2,4) target at `p=3` | proved | `certificates/degree24_polynomial_section_obstruction.json` |
| Collision ninth-power descent | proved necessary condition | `certificates/degree24_collision_descent.json` |
| No collision in reduced box `|n|,d<=256` | exact bounded computation | `certificates/degree24_collision_search_n256_d256.json` |
| No polynomial levels beyond `(4,7)` | proved by Mason--Stothers | `certificates/polynomial_section_mason_bound.json` |
| Both repeated-root `(4,7)` target branches impossible | proved | `certificates/degree47_degenerate_obstruction.json` |
| Generic `(4,7)` target impossible | proved by exact mod-19 obstruction | `certificates/degree47_target_mod19_obstruction.json` |
| Maximal topological passport enumeration | exact finite computation; `{dessins}` class(es) | `certificates/degree47_belyi_passport.json` |
| Optional Gröbner cross-check | `{crosscheck['status']}` | `certificates/degree47_groebner_crosscheck.json` |
| All polynomial identities of this shape at `p=3` impossible | proved | conjunction of the four proof certificates above |
| Rank at least 30 | unknown | not claimed |'''
          )

          append_section(
              'NEGATIVE_RESULTS.md',
              'polynomial-thread-final-v2-negative',
              f'''<!-- polynomial-thread-final-v2-negative -->
## Closed polynomial representation at the historical coefficient

**Status:** `{polynomial_state}`.

{conclusion}

Do not enlarge blind polynomial coefficient searches in this representation.
Rational functions with controlled poles remain open.'''
          )

          append_section(
              'HYPOTHESES.md',
              'controlled-pole-next-hypothesis',
              '''<!-- controlled-pole-next-hypothesis -->
## Controlled-pole replacement hypothesis

**Status:** active, unproved.

Allowing `L` and `Q` to be rational functions with a prescribed pole divisor
may evade the Mason--Stothers polynomial bound while keeping the section height
and coefficient growth controlled.  The next falsifiable test is to fix a
small pole divisor, derive the corresponding Riemann--Roch coefficient space,
and eliminate the target identity exactly before any large specialization
search.'''
          )

          append_section(
              'DECISIONS.md',
              'polynomial-thread-final-v2-decision',
              f'''<!-- polynomial-thread-final-v2-decision -->
## Decision: stop polynomial searches of this shape at `p=3`

{conclusion}

Canonical next action: {next_action}'''
          )

          append_section(
              'STATUS.md',
              'polynomial-thread-final-v2-status',
              f'''<!-- polynomial-thread-final-v2-status -->
## Exact polynomial-thread checkpoint

- Best unconditional lower bound: `rank E(Q) >= 29`.
- Rank-30 certificate: absent.
- Polynomial representation state: `{polynomial_state}`.
- Exact collision box: `{collision['parameter_count']}` parameters, zero collisions.
- Maximal passport: `{dessins}` dessin class(es).
- Gröbner cross-check: `{crosscheck['status']}`.
- Next action: {next_action}'''
          )

          checkpoint_path = root / 'CHECKPOINT.json'
          checkpoint = json.loads(checkpoint_path.read_text(encoding='utf-8')) if checkpoint_path.exists() else {}
          checkpoint['polynomial_inverse_construction'] = {
              'state': polynomial_state,
              'degree24_classification': 'certificates/degree24_polynomial_section_classification.json',
              'degree24_target_obstruction': 'certificates/degree24_polynomial_section_obstruction.json',
              'collision_descent': 'certificates/degree24_collision_descent.json',
              'collision_search': 'certificates/degree24_collision_search_n256_d256.json',
              'mason_bound': 'certificates/polynomial_section_mason_bound.json',
              'degenerate_obstruction': 'certificates/degree47_degenerate_obstruction.json',
              'generic_mod19_obstruction': 'certificates/degree47_target_mod19_obstruction.json',
              'generic_passport': 'certificates/degree47_belyi_passport.json',
              'groebner_crosscheck': 'certificates/degree47_groebner_crosscheck.json',
              'generic_dessin_count': dessins,
              'next_action': next_action,
          }
          checkpoint['mathematical_status'] = {
              'best_unconditional_lower_bound': 29,
              'rank_30_found': False,
              'remaining_gap': 1,
          }
          checkpoint['updated'] = date
          checkpoint_path.write_text(json.dumps(checkpoint, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          frontier_path = root / 'STATUS.frontier.json'
          frontier = json.loads(frontier_path.read_text(encoding='utf-8'))
          frontier['authoritative_lower_bound'] = 29
          frontier['canonical_branch'] = 'main'
          frontier['record_claim'] = False
          frontier['truth_status'] = 'UNSOLVED: exact rank lower bound 29; no rank-30 certificate'
          frontier['polynomial_inverse_construction'] = {
              'state': polynomial_state,
              'exact_conclusion': conclusion,
              'proof_certificates': [
                  'certificates/degree24_polynomial_section_classification.json',
                  'certificates/degree24_polynomial_section_obstruction.json',
                  'certificates/polynomial_section_mason_bound.json',
                  'certificates/degree47_degenerate_obstruction.json',
                  'certificates/degree47_target_mod19_obstruction.json',
              ],
              'generic_dessin_count': dessins,
              'groebner_crosscheck_status': crosscheck['status'],
              'next_action': next_action,
          }
          frontier['updated'] = date
          frontier_path.write_text(json.dumps(frontier, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          registry_path = root / 'APPROACH_REGISTRY.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          if isinstance(registry, list):
              approaches = registry
          elif isinstance(registry, dict):
              approaches = registry.get('approaches')
              if not isinstance(approaches, list):
                  approaches = registry.get('registry')
              if not isinstance(approaches, list):
                  approaches = []
                  registry['approaches'] = approaches
          else:
              raise SystemExit('unsupported APPROACH_REGISTRY.json shape')

          matched = False
          for approach in approaches:
              if not isinstance(approach, dict):
                  continue
              searchable = ' '.join(str(value) for value in approach.values()).lower()
              if 'inverse' not in searchable and 'polynomial' not in searchable:
                  continue
              matched = True
              approach['status'] = polynomial_state
              approach['concrete_next_test'] = next_action
              approach['missing_lemma'] = 'none for polynomial identities of this shape at p=3'
              approach['blocker'] = 'representation exhausted; controlled poles or another geometry are required'
              evidence = approach.get('evidence_against')
              statement = 'complete standard-library proof closes all polynomial levels at p=3'
              if isinstance(evidence, list):
                  if statement not in evidence:
                      evidence.append(statement)
              elif evidence:
                  approach['evidence_against'] = [str(evidence), statement]
              else:
                  approach['evidence_against'] = [statement]
          if not matched:
              approaches.append({
                  'approach_id': 'D-polynomial-p3',
                  'mathematical_family': 'inverse polynomial norm-form construction',
                  'central_mechanism': 'Q^2-v^2L^3 cubic remainder',
                  'assumptions': [],
                  'predicted_advantage': 'low-dimensional exact elimination',
                  'concrete_next_test': next_action,
                  'evidence_for': ['complete degree-(2,4) classification and reusable forcing map'],
                  'evidence_against': ['all polynomial levels at p=3 are now proved impossible'],
                  'computational_cost': 'closed',
                  'missing_lemma': 'none for this representation',
                  'blocker': 'representation exhausted',
                  'status': polynomial_state,
              })
          registry_path.write_text(json.dumps(registry, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/bootstrap-import.yml
          rm -f .github/workflows/bootstrap-import-final.yml
          rm -f .github/workflows/bootstrap-import-final-v2.yml
          rm -f .github/workflows/bootstrap-import-corrected.yml
          rm -f .github/workflows/issue-bootstrap-dispatch.yml
          rm -f .github/workflows/history-cleanup.yml
          rm -f .github/workflows/apply-packet3-theorem.yml
          rm -f .github/workflows/import-canonical-now.yml
          rm -f .github/workflows/integrate-degree24-research.yml
          rm -f .github/workflows/integrate-degree47-passport.yml
          rm -f .github/workflows/integrate-polynomial-thread-final.yml
          rm -f .github/workflows/integrate-degree47-elimination.yml
          rm -f .github/workflows/integrate-polynomial-thread-v2.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Reproduce the final tree
        shell: bash
        run: |
          set -euo pipefail
          python3 research/degree24_polynomial_section_obstruction.py \
            --check certificates/degree24_polynomial_section_obstruction.json
          python3 research/degree24_polynomial_section_classification.py \
            --check certificates/degree24_polynomial_section_classification.json
          python3 research/degree24_collision_descent.py \
            --check certificates/degree24_collision_descent.json
          python3 research/polynomial_section_mason_bound.py \
            --check certificates/polynomial_section_mason_bound.json
          python3 research/degree47_degenerate_obstruction.py \
            --check certificates/degree47_degenerate_obstruction.json
          python3 research/degree47_target_mod19_obstruction.py \
            --check certificates/degree47_target_mod19_obstruction.json
          python3 research/degree47_belyi_passport.py \
            --check certificates/degree47_belyi_passport.json
          python3 research/degree24_collision_search.py \
            --numerator-bound 256 \
            --denominator-bound 256 \
            --expect-collisions 0 \
            --output /tmp/degree24_collision_recheck.json
          cmp certificates/degree24_collision_search_n256_d256.json \
              /tmp/degree24_collision_recheck.json
          python3 verify_exact.py
          python3 -m unittest discover -s tests -v

      - name: Rebuild manifest, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f ! -path './.git/*' ! -name 'MANIFEST.sha256' \
            -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo "No integration changes" >&2; exit 1; }
          git commit -m "Finalize the exact polynomial inverse-construction checkpoint"
          git fetch origin main
          git rebase origin/main
          git push
