name: bootstrap-import

on:
  push:
    paths:
      - "bootstrap/payload.part.*"
      - ".github/workflows/bootstrap-import.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify canonical source archive
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '--- bootstrap files in concatenation order ---'
          find bootstrap -maxdepth 1 -type f -name 'payload.part.*' -printf '%f %s\n' | sort
          printf '%s\n' '--- bootstrap SHA-256 values ---'
          sha256sum bootstrap/payload.part.*
          cat bootstrap/payload.part.* > /tmp/elliptic-rank-30-source.tar.xz.b64
          printf '%s\n' '--- reconstructed base64 ---'
          wc -c /tmp/elliptic-rank-30-source.tar.xz.b64
          sha256sum /tmp/elliptic-rank-30-source.tar.xz.b64
          echo "a40a9009139d283004df7eec666ad06625b082048cc9856420864cf47d7a047b  /tmp/elliptic-rank-30-source.tar.xz.b64" | sha256sum -c -
          base64 -d /tmp/elliptic-rank-30-source.tar.xz.b64 > /tmp/elliptic-rank-30-source.tar.xz
          wc -c /tmp/elliptic-rank-30-source.tar.xz
          sha256sum /tmp/elliptic-rank-30-source.tar.xz
          echo "166ac841bf4326e401dd2071801f1500bcd9e59692da83834e9432f444bbf54c  /tmp/elliptic-rank-30-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/elliptic-rank-30-source.tar.xz
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-import.yml

      - name: Verify imported research package
        shell: bash
        run: |
          set -euo pipefail
          python3 verify_exact.py
          python3 rank_packet_obstruction_tests.py
          python3 -m unittest discover -s tests -v
          sha256sum -c MANIFEST.sha256

      - name: Commit canonical project tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Import canonical rank-30 research pipeline"
          git push
