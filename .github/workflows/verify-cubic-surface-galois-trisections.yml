name: verify-cubic-surface-galois-trisections

on:
  push:
    paths:
      - "research/cubic_surface_galois_trisection_certificate.py"
      - "certificates/cubic_surface_galois_trisections.json"
      - "tests/test_cubic_surface_galois_trisections.py"
      - ".github/workflows/verify-cubic-surface-galois-trisections.yml"
  pull_request:
    paths:
      - "research/cubic_surface_galois_trisection_certificate.py"
      - "certificates/cubic_surface_galois_trisections.json"
      - "tests/test_cubic_surface_galois_trisections.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate the exact shell certificate
        run: python3 research/cubic_surface_galois_trisection_certificate.py
      - name: Run focused theorem tests
        run: python3 -m unittest tests.test_cubic_surface_galois_trisections -v
      - name: Persist canonical generated JSON
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/cubic_surface_galois_trisections.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate the cubic-surface trisection certificate"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
