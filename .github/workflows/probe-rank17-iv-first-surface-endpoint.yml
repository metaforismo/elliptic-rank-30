name: Probe first rank-17 IV surface section ideal

on:
  push:
    branches:
      - research/certified-modular-elimination
    paths:
      - "research/data/rank17_iv_surfaces_f11_v2.json"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      has_candidates: ${{ steps.matrix.outputs.has_candidates }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      candidate_count: ${{ steps.matrix.outputs.candidate_count }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Select all four split branches on the first surface
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data = json.loads(
              Path("research/data/rank17_iv_surfaces_f11_v2.json").read_text()
          )
          candidates = data["candidates"]
          print(f"candidate_count={len(candidates)}")
          if not candidates:
              matrix = {
                  "include": [{
                      "candidate_index": -1,
                      "i4_root": 0,
                      "iv_root": 0,
                  }]
              }
              print("has_candidates=false")
              print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          else:
              first = candidates[0]
              i4_roots = first["split_tangent_checks"]["i4_square_roots"]
              iv_roots = first["split_tangent_checks"]["iv_square_roots"]
              include = [
                  {
                      "candidate_index": 0,
                      "i4_root": int(i4_root),
                      "iv_root": int(iv_root),
                  }
                  for i4_root in i4_roots
                  for iv_root in iv_roots
              ]
              print("has_candidates=true")
              print("matrix=" + json.dumps(
                  {"include": include}, separators=(",", ":")
              ))
          PY

  solve:
    needs: prepare
    if: needs.prepare.outputs.has_candidates == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4

      - name: Compute the endpoint-reduced ideal and multiplication data
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/rank17-iv-endpoint-${{ matrix.candidate_index }}-${{ matrix.i4_root }}-${{ matrix.iv_root }}
          mkdir -p "$root"
          set +e
          timeout --signal=TERM 1740s \
            sage -python research/rank17_iv_section_endpoint_ideal.py \
              --certificate research/data/rank17_iv_surfaces_f11_v2.json \
              --candidate-index ${{ matrix.candidate_index }} \
              --i4-root ${{ matrix.i4_root }} \
              --iv-root ${{ matrix.iv_root }} \
              --multiplication-cap 384 \
              --output "$root/result.json" \
            2>&1 | tee "$root/run.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$root/exit-status.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS)
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank17-iv-endpoint-${{ matrix.candidate_index }}-${{ matrix.i4_root }}-${{ matrix.iv_root }}
          path: /tmp/rank17-iv-endpoint-${{ matrix.candidate_index }}-${{ matrix.i4_root }}-${{ matrix.iv_root }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  no-candidates:
    needs: prepare
    if: needs.prepare.outputs.has_candidates != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Record the finite-field boundary
        run: |
          echo "The normalized split IV surface chart has no F11 candidate."
          echo "This is not a characteristic-zero obstruction."
