name: paper

on:
  pull_request:
    paths:
      - 'paper/**'
      - 'research/**'
      - '.github/workflows/paper.yml'
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - 'research/**'
      - '.github/workflows/paper.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended
      - name: Compile the living paper
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error \
            -jobname=paper -output-directory=paper paper/source/main.tex
          pdflatex -interaction=nonstopmode -halt-on-error \
            -jobname=paper -output-directory=paper paper/source/main.tex
          ! grep -E 'Overfull \\hbox|Overfull \\vbox' paper/paper.log
          test -s paper/paper.pdf
          pdfinfo paper/paper.pdf | grep -E '^Pages:'
          grep -q 'Francesco Giannicola' paper/source/main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: living-paper
          path: paper/paper.pdf
          if-no-files-found: error
