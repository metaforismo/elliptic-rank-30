name: scan-symmetric-k20-s

on:
  push:
    paths:
      - ".github/workflows/scan-symmetric-k20-s.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        prime: [7, 13]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Scan every good affine S residue
        shell: bash
        env:
          PRIME: ${{ matrix.prime }}
        run: |
          set -euo pipefail
          mkdir -p scan-results
          python3 - <<'PY'
          import json
          import os
          import time
          import traceback
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = int(os.environ["PRIME"])
          server = "http://magma.maths.usyd.edu.au/xml/calculator.xml"
          inverse4 = pow(4, -1, p)
          bad = {(-3) % p, (15 * inverse4) % p}
          rows = []
          for s in range(p):
              if s in bad:
                  rows.append({"S": s, "status": "bad_discriminant"})
                  continue
              code = f'''SetColumns(0);
              F:=GF({p}); K<v>:=FunctionField(F);
              S:=F!({s});
              assert (S+3)^2*(4*S-15) ne 0;
              C:=v^3-K!S*v^2+3*v+1;
              E:=EllipticCurve([K|0,0,0,0,v^4*C]);
              assert Discriminant(E) ne 0;
              AI:=AnalyticInformation(E);
              print "R30_PRIME",{p};
              print "R30_S",{s};
              print "R30_ARITHMETIC_RANK",AI[1];
              print "R30_GEOMETRIC_RANK",AI[2];
              print "R30_SYMMETRIC_K20_PASS";
              '''
              base = Path("scan-results") / f"symmetric_k20_p{p}_s{s}"
              base.with_suffix(".m").write_text(code, encoding="utf-8")
              request = urllib.request.Request(
                  server,
                  data=urllib.parse.urlencode({"input": code}).encode(),
                  headers={
                      "Content-Type": "application/x-www-form-urlencoded",
                      "Accept": "application/xml,text/xml,text/html",
                      "Referer": "http://magma.maths.usyd.edu.au/calc/",
                      "User-Agent": "elliptic-rank-30-symmetric-k20/1.1",
                  },
                  method="POST",
              )
              raw = b""
              started = time.time()
              row = {"S": s}
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      raw = response.read()
                      row["http_status"] = response.status
                  base.with_suffix(".xml").write_bytes(raw)
                  root = ET.fromstring(raw)
                  row["magma_version"] = root.findtext(".//headers/version")
                  warning = " ".join(
                      "".join(node.itertext()).strip()
                      for node in root.findall(".//warning")
                  ).strip()
                  lines = ["".join(node.itertext()) for node in root.findall(".//results/line")]
                  text = "\n".join(lines)
                  base.with_suffix(".txt").write_text(text + "\n", encoding="utf-8")
                  row["warning"] = warning
                  row["output"] = text
                  for line in text.splitlines():
                      fields = line.split()
                      if fields[:1] == ["R30_ARITHMETIC_RANK"] and len(fields) > 1:
                          row["arithmetic_rank"] = int(fields[1])
                      if fields[:1] == ["R30_GEOMETRIC_RANK"] and len(fields) > 1:
                          row["geometric_rank"] = int(fields[1])
                  row["status"] = (
                      "pass" if "R30_SYMMETRIC_K20_PASS" in text and not warning else "fail"
                  )
              except Exception:
                  if raw:
                      base.with_suffix(".xml").write_bytes(raw)
                  row["status"] = "exception"
                  row["traceback"] = traceback.format_exc()
              row["elapsed_seconds"] = time.time() - started
              rows.append(row)

          completed = [row for row in rows if row.get("status") == "pass"]
          result = {
              "prime": p,
              "bad_discriminant_residues": sorted(bad),
              "rows": rows,
              "maximal_rank4_residues": [row["S"] for row in completed if row.get("geometric_rank") == 4],
              "rank2_residues": [row["S"] for row in completed if row.get("geometric_rank") == 2],
              "rank0_residues": [row["S"] for row in completed if row.get("geometric_rank") == 0],
              "incomplete_residues": [row["S"] for row in rows if row.get("status") not in ("pass", "bad_discriminant")],
              "truth_status": "exact finite-characteristic scan of all good affine S residues",
          }
          Path(f"scan-results/symmetric_k20_p{p}_summary.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "prime": p,
              "maximal": result["maximal_rank4_residues"],
              "rank2": result["rank2_residues"],
              "rank0": result["rank0_residues"],
              "incomplete": result["incomplete_residues"],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: symmetric-k20-p${{ matrix.prime }}
          path: scan-results/
          if-no-files-found: error
          retention-days: 7
