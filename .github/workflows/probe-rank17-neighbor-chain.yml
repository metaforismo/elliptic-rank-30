name: probe-rank17-neighbor-chain

on:
  push:
    branches: [main]
    paths:
      - "research/replay_rank17_neighbor_chain.py"
      - ".github/workflows/probe-rank17-neighbor-chain.yml"
      - ".github/workflows/probe-rank29-height-lattice.yml"

permissions:
  contents: read

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: sagemath/sagemath:10.9
    steps:
      - uses: actions/checkout@v4
      - name: Replay and serialize the exact neighbor chain
        shell: bash
        run: |
          set -euo pipefail
          sage -python research/replay_rank17_neighbor_chain.py \
            --output /tmp/rank17-neighbor-chain
          sha256sum /tmp/rank17-neighbor-chain/* > /tmp/rank17-neighbor-chain/SHA256SUMS
          sha256sum -c /tmp/rank17-neighbor-chain/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank17-exact-neighbor-chain
          path: /tmp/rank17-neighbor-chain
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
