name: build-living-paper

on:
  push:
    branches: [main]
    paths:
      - "paper/source/**"
      - "paper/paper.tex"
      - "formalization/**"
      - "EllipticRank30.lean"
      - "EllipticRank30/**"
      - ".github/workflows/build-living-paper.yml"
  pull_request:
    paths:
      - "paper/source/**"
      - "paper/paper.tex"
      - "formalization/**"
      - "EllipticRank30.lean"
      - "EllipticRank30/**"
      - ".github/workflows/build-living-paper.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-living-paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the reproducible LaTeX toolchain
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern \
            poppler-utils
      - name: Build and preflight the living paper
        shell: bash
        run: |
          set -euo pipefail
          cp paper/source/main.tex paper/paper.tex
          rm -rf paper/build
          mkdir -p paper/build
          latexmk -pdf -interaction=nonstopmode -halt-on-error \
            -output-directory=paper/build paper/paper.tex
          test -s paper/build/paper.pdf
          if grep -E 'Overfull \\hbox|Overfull \\vbox' paper/build/paper.log; then
            echo 'The paper contains overfull boxes.' >&2
            exit 1
          fi
          if grep -E 'LaTeX Warning:.*undefined' paper/build/paper.log; then
            echo 'The paper contains unresolved LaTeX references or citations.' >&2
            exit 1
          fi
          cp paper/build/paper.pdf paper/paper.pdf
          pdftotext paper/paper.pdf /tmp/paper.txt
          grep -F "Francesco Giannicola" /tmp/paper.txt
          grep -F "new intermediate theorem" /tmp/paper.txt
          grep -F "Lean verification" /tmp/paper.txt
          pages="$(pdfinfo paper/paper.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" -ge 25
          echo "paper_pages=$pages"
          rm -rf paper/build
      - uses: actions/upload-artifact@v4
        with:
          name: living-paper
          path: paper/paper.pdf
          if-no-files-found: error
      - name: Persist the canonical paper on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/paper.tex paper/paper.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build the canonical Francesco Giannicola research paper"
          git pull --rebase origin main
          git push origin HEAD:main
