name: build-living-paper

on:
  push:
    paths:
      - "paper/source/**"
      - ".github/workflows/build-living-paper.yml"
  pull_request:
    paths:
      - "paper/source/**"
      - ".github/workflows/build-living-paper.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-living-paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the reproducible LaTeX toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern \
            poppler-utils
      - name: Build and preflight the living paper
        shell: bash
        run: |
          set -euo pipefail
          cp paper/source/main.tex paper/paper.tex
          rm -rf paper/build
          mkdir -p paper/build
          latexmk -pdf -interaction=nonstopmode -halt-on-error \
            -output-directory=paper/build paper/paper.tex
          cp paper/build/paper.pdf paper/paper.pdf
          pdftotext paper/paper.pdf /tmp/paper.txt
          grep -F "Francesco Giannicola" /tmp/paper.txt
          grep -F "new intermediate theorem" /tmp/paper.txt
          test "$(pdfinfo paper/paper.pdf | awk '/^Pages:/ {print $2}')" -ge 8
          rm -rf paper/build
      - name: Persist the source entry point and PDF
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/paper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/paper.tex paper/paper.pdf .github/workflows/paper.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build the Francesco Giannicola research paper"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
