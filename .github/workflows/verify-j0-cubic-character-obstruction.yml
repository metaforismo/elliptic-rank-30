name: verify-j0-cubic-character-obstruction

on:
  push:
    paths:
      - "research/j0_cubic_character_obstruction_certificate.py"
      - "certificates/j0_cubic_character_obstruction.json"
      - "tests/test_j0_cubic_character_obstruction.py"
      - ".github/workflows/verify-j0-cubic-character-obstruction.yml"
  pull_request:
    paths:
      - "research/j0_cubic_character_obstruction_certificate.py"
      - "certificates/j0_cubic_character_obstruction.json"
      - "tests/test_j0_cubic_character_obstruction.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install exact symbolic dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir sympy==1.14.0
      - name: Regenerate the exact obstruction certificate
        run: python3 research/j0_cubic_character_obstruction_certificate.py
      - name: Run focused theorem tests
        run: python3 -m unittest tests.test_j0_cubic_character_obstruction -v
      - name: Persist canonical generated JSON
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/j0_cubic_character_obstruction.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate the j0 cubic character obstruction"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
