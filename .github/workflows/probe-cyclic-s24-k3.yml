name: probe-cyclic-s24-k3

on:
  push:
    paths:
      - ".github/workflows/probe-cyclic-s24-k3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        prime: [7, 13, 19, 31]
        channel: [k20, k11, k21]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Submit exact function-field rank computation to Magma
        shell: bash
        env:
          PRIME: ${{ matrix.prime }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          mkdir -p probe-results
          python3 - <<'PY'
          import json
          import os
          import time
          import traceback
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          prime = int(os.environ["PRIME"])
          channel = os.environ["CHANNEL"]
          channel_data = {
              "k20": (4, 0, 4),
              "k11": (2, 3, 6),
              "k21": (4, 3, 6),
          }
          v_power, d_power, target = channel_data[channel]
          code = f'''SetColumns(0);
          F:=GF({prime}); K<v>:=FunctionField(F);
          B:=K!(-78732);
          C:=v^3-24*v^2+3*v+1;
          D:=1+4*v;
          A6:=B*v^{v_power}*D^{d_power}*C;
          assert A6 ne 0;
          E:=EllipticCurve([K|0,0,0,0,A6]);
          assert Discriminant(E) ne 0;
          AI:=AnalyticInformation(E);
          print "R30_PRIME",{prime};
          print "R30_CHANNEL","{channel}";
          print "R30_TARGET",{target};
          print "R30_ARITHMETIC_RANK",AI[1];
          print "R30_GEOMETRIC_RANK",AI[2];
          print "R30_CYCLIC_S24_PASS";
          '''
          output_base = Path("probe-results") / f"s24_p{prime}_{channel}"
          output_base.with_suffix(".m").write_text(code, encoding="utf-8")
          server = "http://magma.maths.usyd.edu.au/xml/calculator.xml"
          request = urllib.request.Request(
              server,
              data=urllib.parse.urlencode({"input": code}).encode(),
              headers={
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Accept": "application/xml,text/xml,text/html",
                  "Referer": "http://magma.maths.usyd.edu.au/calc/",
                  "User-Agent": "elliptic-rank-30-cyclic-s24/1.0",
              },
              method="POST",
          )
          started = time.time()
          raw = b""
          result = {
              "prime": prime,
              "channel": channel,
              "target_geometric_rank": target,
              "truth_status": "exact finite-characteristic rank computation only",
          }
          try:
              with urllib.request.urlopen(request, timeout=420) as response:
                  raw = response.read()
                  result["http_status"] = response.status
              output_base.with_suffix(".xml").write_bytes(raw)
              root = ET.fromstring(raw)
              warning = " ".join(
                  "".join(node.itertext()).strip()
                  for node in root.findall(".//warning")
              ).strip()
              lines = ["".join(node.itertext()) for node in root.findall(".//results/line")]
              text = "\n".join(lines)
              output_base.with_suffix(".txt").write_text(text + "\n", encoding="utf-8")
              result["warning"] = warning
              result["output"] = text
              for line in text.splitlines():
                  fields = line.split()
                  if fields[:1] == ["R30_ARITHMETIC_RANK"] and len(fields) > 1:
                      result["arithmetic_rank"] = int(fields[1])
                  if fields[:1] == ["R30_GEOMETRIC_RANK"] and len(fields) > 1:
                      result["geometric_rank"] = int(fields[1])
              result["status"] = (
                  "pass" if "R30_CYCLIC_S24_PASS" in text and not warning else "fail"
              )
              geometric = result.get("geometric_rank")
              result["rejected_for_target_by_this_prime"] = (
                  result["status"] == "pass" and geometric is not None and geometric < target
              )
              result["attains_target_at_this_prime"] = (
                  result["status"] == "pass" and geometric == target
              )
          except Exception:
              if raw:
                  output_base.with_suffix(".xml").write_bytes(raw)
              result["status"] = "exception"
              result["traceback"] = traceback.format_exc()
          result["elapsed_seconds"] = time.time() - started
          output_base.with_suffix(".json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cyclic-s24-p${{ matrix.prime }}-${{ matrix.channel }}
          path: probe-results/
          if-no-files-found: error
          retention-days: 7
