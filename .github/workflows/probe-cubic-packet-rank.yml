name: probe-cubic-packet-rank

on:
  push:
    paths:
      - ".github/workflows/probe-cubic-packet-rank.yml"

permissions:
  contents: read

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: sagemath/sagemath:10.9
    steps:
      - name: Map the specialized cubic and certify anti-invariant rank
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cubic-packet-rank
          cat > /tmp/certify_packet.py <<'PY'
          from __future__ import annotations
          import json, traceback
          from pathlib import Path
          from sage.all import EllipticCurve, EllipticCurve_from_cubic, GF, PolynomialRing, QQ, prime_range, version

          OUT=Path('/tmp/cubic-packet-rank')
          result={'status':'started','sage_version':str(version())}
          def q(s): return QQ(s)
          def rank_mod(rows,l):
            if not rows:return 0
            A=[[int(x)%l for x in r] for r in rows];m=len(A);n=len(A[0]);r=0
            for c in range(n):
              p=next((i for i in range(r,m) if A[i][c]),None)
              if p is None:continue
              A[r],A[p]=A[p],A[r];z=pow(A[r][c],-1,l);A[r]=[(z*x)%l for x in A[r]]
              for i in range(m):
                if i!=r and A[i][c]:
                  z=A[i][c];A[i]=[(x-z*y)%l for x,y in zip(A[i],A[r])]
              r+=1
              if r==m:break
            return r
          def local(E,points,p,l):
            Fp=GF(p); ainvs=[Fp(a.numerator())/Fp(a.denominator()) for a in E.a_invariants()]
            Ep=EllipticCurve(Fp,ainvs);elts=list(Ep);H={l*P for P in elts};un=set(elts);cos=[];which={}
            while un:
              a=next(iter(un));C={a+h for h in H};k=len(cos)
              for P in C:which[P]=k
              un-=C;cos.append(C)
            zero=which[Ep(0)];reps=[next(iter(C)) for C in cos];span={zero:()}
            while len(span)<len(cos):
              b=next(i for i in range(len(cos)) if i not in span);new={}
              for i,v in span.items():
                for c in range(l):new[which[reps[i]+c*reps[b]]]=v+(c,)
              span=new
            vec=[]
            for P in points:
              if P.is_zero():Q=Ep(0)
              else:
                x,y=P[0],P[1]
                if x.denominator()%p==0 or y.denominator()%p==0:raise ZeroDivisionError
                Q=Ep(Fp(x.numerator())/Fp(x.denominator()),Fp(y.numerator())/Fp(y.denominator()))
              vec.append(span[which[Q]])
            return vec,int(Ep.cardinality()),len(next(iter(span.values())))
          def certify(E,points,l):
            rows=[[] for _ in points];used=[];torsion=None
            for p0 in prime_range(5,500):
              p=int(p0)
              try:
                D=E.discriminant()
                if D.numerator()%p==0 or D.denominator()%p==0:continue
                v,N,d=local(E,points,p,l)
              except Exception:continue
              if torsion is None and N%l:torsion={'prime':p,'group_order':N}
              if d:
                used.append({'prime':p,'group_order':N,'quotient_dimension':d})
                for i,z in enumerate(v):rows[i].extend(z)
                rr=rank_mod(rows,l)
                if rr==len(points) and torsion:return {'ell':l,'rank':rr,'primes':used,'torsion_witness':torsion,'rows':rows}
            return {'ell':l,'rank':rank_mod(rows,l),'primes':used,'torsion_witness':torsion,'rows':rows}
          try:
            R=PolynomialRing(QQ,names=('X','Y','Z'));X,Y,Z=R.gens()
            F=(3972*X**3+8080*X**2*Y-65622*X**2*Z+31679*X*Y**2-104467*X*Y*Z-232614*X*Z**2+24484*Y**3-15556*Y**2*Z-173688*Y*Z**2)
            G=(33084*X**3+44912*X**2*Y-62778*X**2*Z+24409*X*Y**2-70613*X*Y*Z-138714*X*Z**2-36220*Y**3-122924*Y**2*Z+347376*Y*Z**2+1042128*Z**3)
            t0=QQ(-1877)/373;cubic=F+t0*G;origin=[QQ(5264)/13547,QQ(-35295)/13547,1]
            branches=[
             [(q('129660/292031'),q('-900249/292031'),1),(q('64/107'),q('-319/107'),1)],
             [(q('63/41'),q('-268/123'),1),(q('1702884/1396775'),q('-3295026/1396775'),1)],
             [(q('8276018/80391893'),q('-273106554/80391893'),1),(q('65380/164569'),q('-513586/164569'),1)],
             [(q('1023660/376139'),q('-1327861/376139'),1),(q('18317104/5249567'),q('-55896457/15748701'),1)],
            ]
            for P in [P for pair in branches for P in pair]:
              if cubic(*P)!=0:raise AssertionError(('off cubic',P))
            phi=EllipticCurve_from_cubic(cubic,origin,morphism=True);E=phi.codomain();C=phi.domain()
            mapped=[[phi(C(list(P))) for P in pair] for pair in branches]
            anti=[pair[0]-pair[1] for pair in mapped]
            certs=[]
            for l in (2,3,5,7,11):
              c=certify(E,anti,l);certs.append(c)
              if c['rank']==4 and c['torsion_witness']:break
            best=max(c['rank'] for c in certs)
            result.update({'status':'ok','t0':str(t0),'elliptic_curve':str(E),'a_invariants':[str(a) for a in E.a_invariants()],'discriminant':str(E.discriminant()),
              'mapped_branch_points':[[[str(P[0]),str(P[1]),str(P[2])] for P in pair] for pair in mapped],
              'anti_invariant_points':[[str(P[0]),str(P[1]),str(P[2])] for P in anti],
              'certificates':certs,'best_rank':best,'proved_anti_invariant_rank_4':bool(best==4),
              'proved_quadratic_base_change_rank_at_least_12':bool(best==4)})
          except Exception as exc:result.update({'status':'error','error':repr(exc),'traceback':traceback.format_exc()})
          (OUT/'result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k not in ('mapped_branch_points','anti_invariant_points','certificates')},indent=2,sort_keys=True))
          PY
          sage -python /tmp/certify_packet.py | tee /tmp/cubic-packet-rank/stdout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubic-packet-rank-probe
          path: /tmp/cubic-packet-rank
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
