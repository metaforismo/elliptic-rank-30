name: probe-cubic-packet-rank

on:
  push:
    paths:
      - ".github/workflows/probe-cubic-packet-rank.yml"

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: sagemath/sagemath:10.9
    steps:
      - name: Map the tangent split fibre to Weierstrass form and certify rank 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tangent-rank12-sage
          cat > /tmp/verify_tangent_rank12.py <<'PY'
          from __future__ import annotations
          import hashlib, json, traceback
          from pathlib import Path
          from sage.all import EllipticCurve, EllipticCurve_from_cubic, GF, PolynomialRing, QQ, matrix, version

          OUT=Path('/tmp/tangent-rank12-sage')
          result={'status':'started','sage_version':str(version())}

          def ev(c,s): return sum(QQ(v)*s**i for i,v in enumerate(c))
          def plane_point(s,k):
              if k=='C1':
                  d=ev([-118794,154067,179873,437604],s)
                  return [ev([72912,289296,-2367708],s)/d,ev([-356382,535113,828915,-1054896],s)/d,QQ(1)]
              if k=='C2':
                  d=ev([-17044,6464,-23081,13816],s)
                  return [ev([46142,104745,-91352],s)/d,ev([-51132,65534,35502,-49904],s)/d,QQ(1)]
              d=ev([5590868988,-13577828351,8426176988],s)
              return [ev([-12673653216,25187117592,-7840260876],s)/d,ev([-4236741228,15734911491,-15419156388],s)/d,QQ(1)]
          def coords(P): return ['0'] if P.is_zero() else [str(P[0]),str(P[1]),str(P[2])]
          def local(E,points,p,l):
              Fp=GF(p); Ep=EllipticCurve(Fp,[Fp(a.numerator())/Fp(a.denominator()) for a in E.a_invariants()])
              elements=list(Ep); H={l*P for P in elements}; un=set(elements); cos=[]; which={}
              while un:
                  a=next(iter(un)); C={a+h for h in H}; k=len(cos)
                  for P in C: which[P]=k
                  un-=C; cos.append(C)
              zero=which[Ep(0)]; reps=[next(iter(C)) for C in cos]; span={zero:()}
              while len(span)<len(cos):
                  b=next(i for i in range(len(cos)) if i not in span); new={}
                  for i,v in span.items():
                      for c in range(l): new[which[reps[i]+c*reps[b]]]=v+(c,)
                  span=new
              vectors=[]
              for P in points:
                  if P.is_zero(): Q=Ep(0)
                  else:
                      x,y=P[0],P[1]
                      if x.denominator()%p==0 or y.denominator()%p==0: raise ZeroDivisionError
                      Q=Ep(Fp(x.numerator())/Fp(x.denominator()),Fp(y.numerator())/Fp(y.denominator()))
                  vectors.append(span[which[Q]])
              return vectors,int(Ep.cardinality()),len(next(iter(span.values())))

          try:
              R=PolynomialRing(QQ,names=('X','Y','Z')); X,Y,Z=R.gens()
              F=(3972*X**3+8080*X**2*Y-65622*X**2*Z+31679*X*Y**2-104467*X*Y*Z-232614*X*Z**2+24484*Y**3-15556*Y**2*Z-173688*Y*Z**2)
              G=(33084*X**3+44912*X**2*Y-62778*X**2*Z+24409*X*Y**2-70613*X*Y*Z-138714*X*Z**2-36220*Y**3-122924*Y**2*Z+347376*Y*Z**2+1042128*Z**3)
              base=[[-2,-1,1],[-4,2,1],[1,-3,1],[4,-3,1],[2,-2,1],[0,3,1],[3,4,1],[-3,0,1],[QQ(5264)/13547,QQ(-35295)/13547,1]]
              base=[[QQ(v) for v in P] for P in base]
              t0=QQ(365818092477169760402380299908211814834104565489875941040628481071268018484711345301844462972962501)/QQ(4142012125131051685428353254938159737590223591619867908992300338442756118014301584601172181648811)
              roots=[
                QQ(-119464831908712738048668746088299)/QQ(1154597342847395736329951370502606),
                QQ(-74260562264603258716762922548661741)/QQ(7211741447506945055617213747917800),
                QQ(45739488084726536936839594954840282)/QQ(25287693007883871587271427228918477),
              ]
              cubic=F+t0*G
              phi=EllipticCurve_from_cubic(cubic,base[8],morphism=True); E,C=phi.codomain(),phi.domain()
              B=[phi(C(P)) for P in base[:8]]; D1=[]; D2=[]; packet=[]
              for s in roots:
                  P1,P2,PQ=(plane_point(s,k) for k in ('C1','C2','Q'))
                  if any(cubic(*P)!=0 for P in (P1,P2,PQ)): raise AssertionError(('point off cubic',str(s)))
                  M1,M2,MQ=(phi(C(P)) for P in (P1,P2,PQ))
                  D1.append(M1-MQ); D2.append(M2-MQ)
                  packet.append({'s':str(s),'C1':coords(M1),'C2':coords(M2),'Q':coords(MQ),'D1':coords(D1[-1]),'D2':coords(D2[-1])})
              all_points=B+[q for pair in zip(D1,D2) for q in pair]
              relation1=[-1,-1,-1,-1,-4,5,2,-1,3,0,3,0,3,0]
              relation2=[-4,2,2,-4,-1,5,-1,2,0,3,0,3,0,3]
              relation_checks=[sum((n*P for n,P in zip(rel,all_points)),E(0)).is_zero() for rel in (relation1,relation2)]
              if relation_checks != [True,True]: raise AssertionError(('trace relations',relation_checks))

              selected=B+[D1[0],D2[0],D1[1],D2[1]]
              labels=[f'B{i}' for i in range(8)]+['D1_0','D2_0','D1_1','D2_1']
              ell=5; primes=[29,59,61,73,89,131,139,179,181,251,281,307]
              rows=[[] for _ in selected]; used=[]; torsion=None
              for p in primes:
                  try: vectors,N,dim=local(E,selected,p,ell)
                  except Exception as exc:
                      used.append({'prime':p,'status':'skipped','error':repr(exc)}); continue
                  if torsion is None and N%ell: torsion={'prime':p,'group_order':N}
                  if dim:
                      used.append({'prime':p,'status':'used','group_order':N,'quotient_dimension':dim})
                      for i,v in enumerate(vectors): rows[i].extend(v)
                  else: used.append({'prime':p,'status':'zero_quotient','group_order':N,'quotient_dimension':0})
              rank=int(matrix(GF(ell),rows).rank())
              if rank!=12 or torsion is None: raise AssertionError(('rank certificate',rank,torsion))
              result.update({
                'status':'proved','claim_status':'independent SageMath rank-12 finite-reduction certificate',
                't0':str(t0),'roots':[str(s) for s in roots],
                'a_invariants':[str(a) for a in E.a_invariants()],'discriminant':str(E.discriminant()),
                'selected_labels':labels,'selected_points':[coords(P) for P in selected],
                'all_packet_points':packet,'trace_relation_checks':relation_checks,
                'ell':ell,'finite_reduction_rank':rank,'rows':rows,'local_records':used,'torsion_witness':torsion,
                'proved_displayed_subgroup_rank_12':True,
                'truth_note':'Two exact independent trace relations give rank at most 12; the finite-reduction certificate gives rank at least 12. This is not a rank-30 result.'
              })
          except Exception as exc: result.update({'status':'error','error':repr(exc),'traceback':traceback.format_exc()})
          raw=json.dumps(result,sort_keys=True,separators=(',',':')).encode(); result['record_sha256']=hashlib.sha256(raw).hexdigest(); (OUT/'result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':result.get('status'),'rank':result.get('finite_reduction_rank'),'torsion_witness':result.get('torsion_witness'),'error':result.get('error'),'record_sha256':result.get('record_sha256')},indent=2,sort_keys=True))
          if result.get('status')!='proved': raise SystemExit(1)
          PY
          sage -python /tmp/verify_tangent_rank12.py | tee /tmp/tangent-rank12-sage/stdout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tangent-split-rank12-sage
          path: /tmp/tangent-rank12-sage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
