name: probe-cubic-packet-rank

on:
  push:
    paths:
      - ".github/workflows/probe-cubic-packet-rank.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: sagemath/sagemath:10.9
    steps:
      - name: Compute all local ranks and exact trace points
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/split-packet-diagnostics
          cat > /tmp/diagnose_split_packet.py <<'PY'
          from __future__ import annotations
          import hashlib, json, traceback
          from pathlib import Path
          from sage.all import EllipticCurve, EllipticCurve_from_cubic, GF, PolynomialRing, QQ, matrix, prime_range, version

          OUT=Path('/tmp/split-packet-diagnostics')
          result={'status':'started','sage_version':str(version())}

          def row_rank(rows,l):
              return 0 if not rows else int(matrix(GF(l),rows).rank())

          def local(E,points,p,l):
              Fp=GF(p)
              Ep=EllipticCurve(Fp,[Fp(a.numerator())/Fp(a.denominator()) for a in E.a_invariants()])
              elements=list(Ep); H={l*P for P in elements}; un=set(elements); cos=[]; which={}
              while un:
                  a=next(iter(un)); C={a+h for h in H}; k=len(cos)
                  for P in C: which[P]=k
                  un-=C; cos.append(C)
              zero=which[Ep(0)]; reps=[next(iter(C)) for C in cos]; span={zero:()}
              while len(span)<len(cos):
                  b=next(i for i in range(len(cos)) if i not in span); new={}
                  for i,v in span.items():
                      for c in range(l): new[which[reps[i]+c*reps[b]]]=v+(c,)
                  span=new
              vectors=[]
              for P in points:
                  if P.is_zero(): Q=Ep(0)
                  else:
                      x,y=P[0],P[1]
                      if x.denominator()%p==0 or y.denominator()%p==0: raise ZeroDivisionError
                      Q=Ep(Fp(x.numerator())/Fp(x.denominator()),Fp(y.numerator())/Fp(y.denominator()))
                  vectors.append(span[which[Q]])
              return vectors,int(Ep.cardinality()),len(next(iter(span.values())))

          def certificate(E,points,l,bound=700):
              rows=[[] for _ in points]; used=[]; torsion=None; D=E.discriminant()
              for p0 in prime_range(5,bound):
                  p=int(p0)
                  try:
                      if D.numerator()%p==0 or D.denominator()%p==0: continue
                      vectors,N,dim=local(E,points,p,l)
                  except Exception: continue
                  if torsion is None and N%l: torsion={'prime':p,'group_order':N}
                  if dim:
                      used.append({'prime':p,'group_order':N,'quotient_dimension':dim})
                      for i,v in enumerate(vectors): rows[i].extend(v)
              M=matrix(GF(l),rows)
              kernel=[[int(x) for x in v] for v in M.left_kernel().basis()]
              return {'ell':l,'rank':int(M.rank()),'kernel_dimension':int(M.left_kernel().dimension()),'kernel_basis':kernel,'primes':used,'torsion_witness':torsion,'rows':rows}

          def ev(c,s): return sum(QQ(v)*s**i for i,v in enumerate(c))
          def point(s,k):
              if k=='C1':
                  d=ev([-118794,154067,179873,437604],s)
                  return [ev([72912,289296,-2367708],s)/d,ev([-356382,535113,828915,-1054896],s)/d,QQ(1)]
              if k=='C2':
                  d=ev([-17044,6464,-23081,13816],s)
                  return [ev([46142,104745,-91352],s)/d,ev([-51132,65534,35502,-49904],s)/d,QQ(1)]
              d=ev([5590868988,-13577828351,8426176988],s)
              return [ev([-12673653216,25187117592,-7840260876],s)/d,ev([-4236741228,15734911491,-15419156388],s)/d,QQ(1)]
          def coords(P): return ['0'] if P.is_zero() else [str(P[0]),str(P[1]),str(P[2])]

          try:
              R=PolynomialRing(QQ,names=('X','Y','Z')); X,Y,Z=R.gens()
              F=(3972*X**3+8080*X**2*Y-65622*X**2*Z+31679*X*Y**2-104467*X*Y*Z-232614*X*Z**2+24484*Y**3-15556*Y**2*Z-173688*Y*Z**2)
              G=(33084*X**3+44912*X**2*Y-62778*X**2*Z+24409*X*Y**2-70613*X*Y*Z-138714*X*Z**2-36220*Y**3-122924*Y**2*Z+347376*Y*Z**2+1042128*Z**3)
              base=[[-2,-1,1],[-4,2,1],[1,-3,1],[4,-3,1],[2,-2,1],[0,3,1],[3,4,1],[-3,0,1],[QQ(5264)/13547,QQ(-35295)/13547,1]]
              base=[[QQ(v) for v in P] for P in base]
              roots=[QQ(-16253)/2248,QQ(-7838)/67937,QQ(34)/19]
              t0=QQ(1427161)/111293; cubic=F+t0*G
              phi=EllipticCurve_from_cubic(cubic,base[8],morphism=True); E,C=phi.codomain(),phi.domain()
              B=[phi(C(P)) for P in base[:8]]; D1=[]; D2=[]; packet=[]
              for s in roots:
                  P1,P2,PQ=point(s,'C1'),point(s,'C2'),point(s,'Q')
                  if any(cubic(*P)!=0 for P in (P1,P2,PQ)): raise AssertionError(('point off cubic',str(s)))
                  M1,M2,MQ=(phi(C(P)) for P in (P1,P2,PQ))
                  D1.append(M1-MQ); D2.append(M2-MQ)
                  packet.append({'s':str(s),'C1':coords(M1),'C2':coords(M2),'Q':coords(MQ),'D1':coords(D1[-1]),'D2':coords(D2[-1])})
              points=B+[q for pair in zip(D1,D2) for q in pair]
              labels=[f'B{i}' for i in range(8)]+[f'{kind}_{j}' for j in range(3) for kind in ('D1','D2')]
              certs=[certificate(E,points,l) for l in (2,3,5,7,11,13,17,19)]
              best=max(certs,key=lambda c:c['rank'])
              traces={'T1':coords(sum(D1,E(0))),'T2':coords(sum(D2,E(0))),'T1_minus_T2':coords(sum(D1,E(0))-sum(D2,E(0)))}
              result.update({'status':'ok','claim_status':'exact diagnostic computation','t0':str(t0),'cover_roots':[str(s) for s in roots],'a_invariants':[str(a) for a in E.a_invariants()],'discriminant':str(E.discriminant()),'labels':labels,'mapped_base_points':[coords(P) for P in B],'packet_points':packet,'trace_points':traces,'certificates':certs,'best_ell':best['ell'],'best_rank':best['rank'],'best_kernel_dimension':best['kernel_dimension'],'proved_rank_lower_bound':best['rank'] if best['torsion_witness'] else None,'truth_note':'Finite-reduction ranks are rigorous lower bounds when accompanied by the recorded torsion witness. Kernel vectors are modular relations, not automatically integral Mordell-Weil relations.'})
          except Exception as exc: result.update({'status':'error','error':repr(exc),'traceback':traceback.format_exc()})
          raw=json.dumps(result,sort_keys=True,separators=(',',':')).encode(); result['record_sha256']=hashlib.sha256(raw).hexdigest(); (OUT/'result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':result.get('status'),'best_ell':result.get('best_ell'),'best_rank':result.get('best_rank'),'kernel_dimension':result.get('best_kernel_dimension'),'ranks':{str(c['ell']):c['rank'] for c in result.get('certificates',[])},'error':result.get('error'),'record_sha256':result.get('record_sha256')},indent=2,sort_keys=True))
          if result.get('status')!='ok': raise SystemExit(1)
          PY
          sage -python /tmp/diagnose_split_packet.py | tee /tmp/split-packet-diagnostics/stdout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-three-trisection-packet-diagnostics
          path: /tmp/split-packet-diagnostics
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
