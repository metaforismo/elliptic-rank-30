name: apply-frontier-paper-update

on:
  push:
    paths:
      - "research/apply_frontier_paper_update.py"
      - "research/riemann_roch_visibility_barrier.md"
      - "research/torsion_packet_capacity.md"
      - ".github/workflows/apply-frontier-paper-update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact frontier to the living paper
        shell: bash
        run: |
          set -euo pipefail
          python3 research/apply_frontier_paper_update.py
          python3 research/riemann_roch_visibility_certificate.py
          python3 research/torsion_packet_capacity_certificate.py
          python3 -m unittest discover -s tests -v
      - name: Compile PDF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended
          cd paper
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          ! grep -E 'Overfull \\hbox|Overfull \\vbox' paper.log
          rm -f *.aux *.log *.out *.toc *.fls *.fdb_latexmk *.synctex.gz
      - name: Refresh manifest and commit in place
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-frontier-paper-update.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f ! -path './.git/*' ! -name MANIFEST.sha256 -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document the exact 2026-08-07 research frontier" || exit 0
          git push
