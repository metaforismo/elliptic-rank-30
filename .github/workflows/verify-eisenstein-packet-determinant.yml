name: verify-eisenstein-packet-determinant

on:
  push:
    paths:
      - "src/eisenstein.py"
      - "research/eisenstein_packet_determinant_certificate.py"
      - "certificates/eisenstein_packet_determinant.json"
      - "tests/test_eisenstein_packet_determinant.py"
      - ".github/workflows/verify-eisenstein-packet-determinant.yml"
  pull_request:
    paths:
      - "src/eisenstein.py"
      - "research/eisenstein_packet_determinant_certificate.py"
      - "certificates/eisenstein_packet_determinant.json"
      - "tests/test_eisenstein_packet_determinant.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate the exact determinant certificate
        run: python3 research/eisenstein_packet_determinant_certificate.py
      - name: Run focused arithmetic tests
        run: python3 -m unittest tests.test_eisenstein_packet_determinant -v
      - name: Persist canonical generated JSON
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/eisenstein_packet_determinant.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate the Eisenstein packet determinant certificate"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
