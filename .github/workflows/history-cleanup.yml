name: one-time-history-cleanup

on:
  push:
    paths:
      - ".github/workflows/history-cleanup.yml"

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reverify canonical repository tree
        shell: bash
        run: |
          set -euo pipefail
          python3 verify_exact.py
          python3 rank_packet_obstruction_tests.py
          python3 -m unittest discover -s tests -v
          sha256sum -c MANIFEST.sha256
          test ! -d bootstrap

      - name: Replace bootstrap history with one canonical root commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .github/workflows/history-cleanup.yml
          git checkout --orphan canonical-main
          git reset
          git add -A
          git commit -m "Initial import of canonical rank-30 research pipeline"
          git push --force origin canonical-main:main
